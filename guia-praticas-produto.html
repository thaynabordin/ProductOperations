<!-- ===================== OKRs ===================== -->
<section class="section" id="okrs" data-title="OKRs">
  <div class="eyebrow">01 · Strategy</div>
  <h1 class="title">Managing <em>OKRs</em></h1>
  <p class="lede">Objectives and Key Results connect strategy to measurable outcomes. They give the team focus and leave it free to choose how to get there.</p>

  <div class="block">
    <div class="block-head"><h2>Anatomy</h2></div>
    <div class="grid g3">
      <div class="card hl"><div class="kicker">What</div><h4>Objective</h4><p>Qualitative, inspiring and time-bound. Answers "what do we want to achieve?".</p></div>
      <div class="card hl"><div class="kicker">How we'll know</div><h4>Key Results</h4><p>3 to 5 per objective. Quantitative, with a baseline and a target, measuring outcomes rather than tasks.</p></div>
      <div class="card hl"><div class="kicker">What we'll try</div><h4>Initiatives</h4><p>Bets we believe will move the KRs. They can change during the cycle without changing the OKR.</p></div>
    </div>
  </div>

  <div class="block">
    <div class="block-head"><h2>Outcome, not output</h2><span>The most common mistake</span></div>
    <div class="card">
      <div class="compare">
        <div class="from"><span class="lbl">✗ KR as output</span>Launch the new sign-up flow by March</div>
        <div class="arrow">→</div>
        <div class="to"><span class="lbl">✓ KR as outcome</span>Increase sign-up completion from 40% to 60% by March</div>
      </div>
      <div class="compare">
        <div class="from"><span class="lbl">✗ KR as activity</span>Run 10 customer interviews</div>
        <div class="arrow">→</div>
        <div class="to"><span class="lbl">✓ KR as outcome</span>Reduce first-month cancellations from 25% to 15%</div>
      </div>
    </div>
  </div>

  <div class="block grid g2">
    <div class="card">
      <div class="kicker">Cycle</div>
      <div class="steps">
        <div class="step"><span class="step-n">01</span><div><h5>Set objectives</h5><p>Leadership direction combined with proposals from the teams.</p></div></div>
        <div class="step"><span class="step-n">02</span><div><h5>Write the KRs</h5><p>Each KR with a metric, baseline, target and data source.</p></div></div>
        <div class="step"><span class="step-n">03</span><div><h5>Assign owners</h5><p>One person responsible for tracking each KR.</p></div></div>
        <div class="step"><span class="step-n">04</span><div><h5>Track</h5><p>Weekly check-in on progress and confidence in the target.</p></div></div>
        <div class="step"><span class="step-n">05</span><div><h5>Review and learn</h5><p>At the end of the cycle, assess what worked and carry it into the next one.</p></div></div>
      </div>
    </div>
    <div class="grid" style="align-content:start">
      <div class="card side">
        <div class="kicker">Example · Online learning platform</div>
        <h4>Help students finish what they start</h4>
        <p><b style="color:var(--accent-2)">KR1</b> Course completion from 12% to 25%</p>
        <p><b style="color:var(--accent-2)">KR2</b> Students active in week 2 from 40% to 55%</p>
        <p><b style="color:var(--accent-2)">KR3</b> Average lesson rating from 4.1 to 4.5</p>
      </div>
      <div class="card side">
        <div class="kicker">Example · Recipe app</div>
        <h4>Make the app part of the kitchen routine</h4>
        <p><b style="color:var(--accent-2)">KR1</b> Recipes cooked per active user from 1.2 to 2 per month</p>
        <p><b style="color:var(--accent-2)">KR2</b> D30 retention from 18% to 25%</p>
      </div>
    </div>
  </div>

  <div class="block grid g2">
    <div class="card">
      <div class="kicker">Good practices</div>
      <ul class="list">
        <li>Few objectives per cycle. Focus beats coverage.</li>
        <li>Separate committed OKRs (must be met) from aspirational ones (reaching ~70% is already a good result).</li>
        <li>Revisit initiatives whenever data shows they aren't moving the KR.</li>
        <li>Keep OKRs public to all teams.</li>
      </ul>
    </div>
    <div class="card">
      <div class="kicker">Avoid</div>
      <ul class="list">
        <li>KRs that are task or delivery lists</li>
        <li>KRs without a baseline, which make progress impossible to measure</li>
        <li>Tying OKRs to individual performance reviews, which discourages ambitious goals</li>
        <li>Setting them at the start and only looking again at the end of the cycle</li>
      </ul>
    </div>
  </div>

  <div class="block">
    <div class="block-head"><h2>Roles</h2></div>
    <div class="grid g4">
      <div class="card plain"><h5>Leadership</h5><p>Sets the direction and the top-level objectives.</p></div>
      <div class="card plain"><h5>Product Manager</h5><p>Translates direction into team OKRs and runs the tracking.</p></div>
      <div class="card plain"><h5>Team</h5><p>Proposes initiatives and owns how to reach the outcomes.</p></div>
      <div class="card plain"><h5>Stakeholders</h5><p>Align expectations and follow progress.</p></div>
    </div>
  </div>
</section>

<!-- ===================== ROADMAP ===================== -->
<section class="section" id="roadmap" data-title="Roadmap">
  <div class="eyebrow">02 · Strategy</div>
  <h1 class="title">Strategic <em>roadmap</em></h1>
  <p class="lede">Communicates the product's direction over time. It is an alignment tool, not a list of promises with dates.</p>

  <div class="block">
    <div class="block-head"><h2>Formats</h2><span>Choose by level of uncertainty</span></div>
    <div class="grid g3">
      <div class="card hl">
        <div class="kicker">By horizon</div>
        <h4>Now · Next · Later</h4>
        <p>Organized by time horizon, without dates. "Now" is in progress, "Next" is validated and prioritized, "Later" holds bets and opportunities.</p>
        <div class="when"><b>When to use</b>Products with high uncertainty and teams that need flexibility to react to what they learn.</div>
      </div>
      <div class="card hl">
        <div class="kicker">By outcome</div>
        <h4>Outcome-based</h4>
        <p>Organized by problems to solve or metrics to move, linked to OKRs. Solutions appear as hypotheses, not commitments.</p>
        <div class="when"><b>When to use</b>To align leadership around impact and give teams autonomy to find solutions.</div>
      </div>
      <div class="card hl">
        <div class="kicker">By date</div>
        <h4>Timeline</h4>
        <p>Organizes deliveries and milestones on a calendar. Makes dependencies and deadlines visible.</p>
        <div class="when"><b>When to use</b>When there are real external dates: regulatory obligations, coordinated launches, contracts.</div>
      </div>
    </div>
  </div>

  <div class="block">
    <div class="block-head"><h2>Confidence horizons</h2></div>
    <p class="block-intro">The further out, the less detail and commitment. Communicate this explicitly.</p>
    <div class="grid g3">
      <div class="horizon" style="background:var(--accent-soft);border-color:var(--accent-line)"><div class="range">1 to 3 months</div><h4>Now</h4><p>Items in progress or ready to start, with a defined scope.</p><div class="conf"><i class="on"></i><i class="on"></i><i class="on"></i></div></div>
      <div class="horizon"><div class="range">3 to 6 months</div><h4>Next</h4><p>Prioritized problems, in discovery or with a solution being validated.</p><div class="conf"><i class="on"></i><i class="on"></i><i></i></div></div>
      <div class="horizon" style="border-style:dashed"><div class="range">6+ months</div><h4>Later</h4><p>Strategic direction, opportunities and big bets.</p><div class="conf"><i class="on"></i><i></i><i></i></div></div>
    </div>
  </div>

  <div class="block grid g2">
    <div class="card">
      <div class="kicker">How it works</div>
      <div class="steps">
        <div class="step"><span class="step-n">01</span><div><h5>Gather inputs</h5><p>Strategy, OKRs, usage data, research and stakeholder requests.</p></div></div>
        <div class="step"><span class="step-n">02</span><div><h5>Prioritize</h5><p>With explicit criteria. See the <button class="go" data-go="priorizacao" style="color:var(--accent-2);border-bottom:1px solid var(--accent-line)">Prioritization</button> section.</p></div></div>
        <div class="step"><span class="step-n">03</span><div><h5>Communicate by audience</h5><p>The same roadmap, with different levels of detail for each audience.</p></div></div>
        <div class="step"><span class="step-n">04</span><div><h5>Review</h5><p>Monthly for detail, quarterly for direction.</p></div></div>
      </div>
    </div>
    <div class="grid" style="align-content:start">
      <div class="card">
        <div class="kicker">By audience</div>
        <p><b style="color:var(--text)">Leadership:</b> themes, expected outcomes and bets.</p>
        <p><b style="color:var(--text)">Team:</b> problems, priorities and dependencies.</p>
        <p><b style="color:var(--text)">Customers and partner areas:</b> expected benefits, without exact dates when uncertainty is high.</p>
      </div>
      <div class="card" style="border-left:1px solid var(--bad)">
        <div class="kicker" style="color:var(--bad)">Anti-patterns</div>
        <ul class="list">
          <li>Roadmap as a list of promised features</li>
          <li>Fixed dates with no room for discovery</li>
          <li>Items with no link to OKRs or metrics</li>
          <li>A document created once and never revisited</li>
        </ul>
      </div>
    </div>
  </div>
</section>

<!-- ===================== PRIORITIZATION ===================== -->
<section class="section" id="priorizacao" data-title="Prioritization">
  <div class="eyebrow">03 · Strategy</div>
  <h1 class="title">Prioritization <em>frameworks</em></h1>
  <p class="lede">No framework decides on its own. They make criteria explicit and keep the conversation objective. Use the numbers to compare, not to end the discussion.</p>

  <div class="block">
    <div class="block-head"><h2>Which one to use?</h2></div>
    <div class="card table-wrap">
      <table class="table">
        <thead><tr><th>Situation</th><th>Framework</th></tr></thead>
        <tbody>
          <tr><td>Quick triage of ideas in a workshop</td><td><span class="go">Value × Effort</span></td></tr>
          <tr><td>Comparing many initiatives when usage data exists</td><td><span class="go">RICE</span></td></tr>
          <tr><td>Experiments and fast growth decisions</td><td><span class="go">ICE</span></td></tr>
          <tr><td>Locking the scope of a fixed-date delivery</td><td><span class="go">MoSCoW</span></td></tr>
          <tr><td>Several teams competing for capacity, when timing changes value</td><td><span class="go">WSJF / Cost of Delay</span></td></tr>
          <tr><td>Understanding what is basic and what delights users</td><td><span class="go">Kano</span></td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <div class="block">
    <div class="block-head"><h2>Value × Effort</h2><span>2×2 matrix</span></div>
    <div class="matrix">
      <div class="axis y">Value ↑</div>
      <div class="cell best"><h5>Quick wins</h5><p>High value, low effort. Do first.</p></div>
      <div class="cell"><h5>Big bets</h5><p>High value, high effort. Plan and slice.</p></div>
      <div class="cell"><h5>Fill-ins</h5><p>Low value, low effort. Do if capacity allows.</p></div>
      <div class="cell" style="background:transparent;border-style:dashed"><h5>Avoid</h5><p>Low value, high effort. Drop or rethink.</p></div>
      <div class="axis x">Effort →</div>
    </div>
  </div>

  <div class="block grid g2">
    <div class="card hl" style="grid-column:1/-1">
      <div class="kicker">RICE</div>
      <h4>Reach, Impact, Confidence and Effort</h4>
      <div class="formula">(<em>Reach</em> × <em>Impact</em> × <em>Confidence</em>) ÷ <em>Effort</em></div>
      <div class="grid g4">
        <div><h5>Reach</h5><p>How many people are affected in a period (e.g. users per quarter).</p></div>
        <div><h5>Impact</h5><p>How much it changes for each person: 3 massive, 2 high, 1 medium, 0.5 low, 0.25 minimal.</p></div>
        <div><h5>Confidence</h5><p>How solid the evidence is: 100% high, 80% medium, 50% low.</p></div>
        <div><h5>Effort</h5><p>Total team work, in person-weeks or person-months.</p></div>
      </div>
      <div class="calc" id="rice">
        <div><label for="rReach">Reach</label><input id="rReach" type="number" min="0" value="2000"></div>
        <div><label for="rImpact">Impact</label>
          <select id="rImpact"><option value="3">3 · Massive</option><option value="2" selected>2 · High</option><option value="1">1 · Medium</option><option value="0.5">0.5 · Low</option><option value="0.25">0.25 · Minimal</option></select></div>
        <div><label for="rConf">Confidence</label>
          <select id="rConf"><option value="1">100% · High</option><option value="0.8" selected>80% · Medium</option><option value="0.5">50% · Low</option></select></div>
        <div><label for="rEffort">Effort</label><input id="rEffort" type="number" min="0.1" step="0.5" value="4"></div>
        <div class="score"><b id="rScore">800</b><span>RICE score</span></div>
      </div>
    </div>
    <div class="card">
      <div class="kicker">ICE</div>
      <h4>Impact, Confidence and Ease</h4>
      <div class="formula"><em>Impact</em> × <em>Confidence</em> × <em>Ease</em></div>
      <p>Each criterion is scored 1 to 10. Lighter than RICE and useful for comparing experiments quickly.</p>
      <div class="when"><b>Watch out</b>Scores are subjective. Calibrate with the team and revisit once you have results.</div>
    </div>
    <div class="card">
      <div class="kicker">WSJF · Cost of Delay</div>
      <h4>Weighted Shortest Job First</h4>
      <div class="formula">(<em>Value</em> + <em>Urgency</em> + <em>Risk reduction</em>) ÷ <em>Size</em></div>
      <p>Prioritizes what delivers the most value per unit of time and shows what waiting costs.</p>
      <div class="when"><b>Watch out</b>Works best with relative scores (Fibonacci scale), comparing items against each other.</div>
    </div>
  </div>

  <div class="block">
    <div class="block-head"><h2>MoSCoW</h2><span>For fixed-date scope</span></div>
    <div class="grid g4">
      <div class="moscow m1"><div class="letter">M</div><h5>Must have</h5><p>Without it the delivery doesn't work or doesn't make sense.</p></div>
      <div class="moscow m2"><div class="letter">S</div><h5>Should have</h5><p>Important, but there's a temporary workaround.</p></div>
      <div class="moscow m3"><div class="letter">C</div><h5>Could have</h5><p>Desirable, included if there's capacity.</p></div>
      <div class="moscow"><div class="letter" style="color:var(--muted)">W</div><h5>Won't have (now)</h5><p>Out of this scope, recorded for later.</p></div>
    </div>
    <p class="block-intro" style="margin-top:14px">Common rule of thumb: "Musts" shouldn't exceed ~60% of the effort, leaving room for the unexpected.</p>
  </div>

  <div class="block">
    <div class="block-head"><h2>Kano model</h2><span>Perceived value</span></div>
    <div class="grid g3">
      <div class="card"><div class="kicker">Basic</div><h4>Must-be</h4><p>Their absence causes dissatisfaction, but their presence doesn't delight. E.g. login working.</p></div>
      <div class="card"><div class="kicker">Performance</div><h4>More is better</h4><p>Satisfaction grows with quality. E.g. speed, fewer steps.</p></div>
      <div class="card"><div class="kicker">Delighters</div><h4>Surprising</h4><p>Nobody asks for them, but they create excitement. Over time, they become basics.</p></div>
    </div>
  </div>
</section>

<!-- ===================== UPSTREAM ===================== -->
<section class="section" id="upstream" data-title="Upstream and Downstream">
  <div class="eyebrow">04 · Discovery</div>
  <h1 class="title">Upstream and <em>Downstream</em></h1>
  <p class="lede">Separating conception from execution ensures the team understands the problem before investing in development. The two tracks run in parallel and feed each other all the time.</p>

  <div class="block grid g2">
    <div class="card hl">
      <div class="kicker">Upstream · Conception</div>
      <h4>Decide what to build</h4>
      <div class="steps">
        <div class="step"><span class="step-n">01</span><div><h5>Explore the problem</h5><p>Understand the root of the request.</p></div></div>
        <div class="step"><span class="step-n">02</span><div><h5>Connect to strategy</h5><p>Relate it to the vision and OKRs.</p></div></div>
        <div class="step"><span class="step-n">03</span><div><h5>Run discovery</h5><p>Research and test hypotheses.</p></div></div>
        <div class="step"><span class="step-n">04</span><div><h5>Validate the minimum solution</h5><p>Prototypes and user tests.</p></div></div>
      </div>
    </div>
    <div class="card" style="border-top:1px solid var(--line-2)">
      <div class="kicker" style="color:var(--text-2)">Downstream · Execution</div>
      <h4>Build it well</h4>
      <div class="steps">
        <div class="step"><span class="step-n">01</span><div><h5>Detail requirements</h5><p>Stories with clear acceptance criteria.</p></div></div>
        <div class="step"><span class="step-n">02</span><div><h5>Develop</h5><p>Incremental deliveries in short cycles.</p></div></div>
        <div class="step"><span class="step-n">03</span><div><h5>Test and accept</h5><p>Quality checks and business validation.</p></div></div>
        <div class="step"><span class="step-n">04</span><div><h5>Measure impact</h5><p>Compare results with the success metric.</p></div></div>
      </div>
    </div>
  </div>

  <div class="block grid g2">
    <div class="card side">
      <div class="kicker">Handover criteria</div>
      <h4>Ready for downstream when…</h4>
      <ul class="list check">
        <li>The problem has been validated with evidence</li>
        <li>The success metric has a baseline and a target</li>
        <li>The solution has been tested with users</li>
        <li>Technical feasibility has been confirmed</li>
        <li>There are stories with acceptance criteria (Definition of Ready)</li>
      </ul>
    </div>
    <div class="grid" style="align-content:start">
      <div class="card"><h5>Don't skip upstream steps</h5><p>Building the wrong thing fast costs more than slowly discovering the right thing.</p></div>
      <div class="card"><h5>Define success before building</h5><p>Without a metric defined upfront, there's no way to tell later whether it worked.</p></div>
      <div class="card"><h5>Close the loop</h5><p>What you learn by measuring downstream feeds the next upstream.</p></div>
    </div>
  </div>
</section>

<!-- ===================== DISCOVERY & DESIGN ===================== -->
<section class="section" id="discovery" data-title="From problem to solution">
  <div class="eyebrow">05 · Discovery</div>
  <h1 class="title">From problem to <em>solution</em></h1>
  <p class="lede">Discovery and design go hand in hand. First understand and choose the right problem, then create and validate the right solution, diverging and converging twice.</p>

  <div class="block">
    <div class="block-head"><h2>Double Diamond</h2><span>Diverge and converge twice</span></div>
    <div class="grid" style="grid-template-columns:1fr 1fr;margin-bottom:8px">
      <div class="kicker" style="text-align:center;margin:0">Problem space</div>
      <div class="kicker" style="text-align:center;margin:0">Solution space</div>
    </div>
    <svg class="diamond" viewBox="0 0 800 140" aria-hidden="true">
      <polygon points="10,70 200,10 390,70 200,130" fill="rgba(155,127,212,0.08)" stroke="#9B7FD4" stroke-width="1"/>
      <polygon points="410,70 600,10 790,70 600,130" fill="none" stroke="#9B7FD4" stroke-width="1" stroke-dasharray="4 4"/>
      <line x1="200" y1="10" x2="200" y2="130" stroke="#3a3456" stroke-width="1"/>
      <line x1="600" y1="10" x2="600" y2="130" stroke="#3a3456" stroke-width="1"/>
      <text x="400" y="76" text-anchor="middle" fill="#D4C4F0" font-family="Cormorant Garamond, serif" font-style="italic" font-size="18">→</text>
    </svg>
    <div class="grid g4">
      <div class="phase"><div class="mode">Diverge</div><h5>Discover</h5><p>Research the context, the people and the problem broadly.</p></div>
      <div class="phase"><div class="mode">Converge</div><h5>Define</h5><p>Synthesize findings and choose the right problem to solve.</p></div>
      <div class="phase"><div class="mode">Diverge</div><h5>Develop</h5><p>Generate multiple possible solutions, prototype and test.</p></div>
      <div class="phase"><div class="mode">Converge</div><h5>Deliver</h5><p>Refine the validated solution and prepare the handover to downstream.</p></div>
    </div>
  </div>

  <div class="block">
    <div class="block-head"><h2>The four risks</h2><span>What this process reduces</span></div>
    <div class="grid g4">
      <div class="card hl"><div class="kicker">Value</div><h4>Will they want it?</h4><p>Will people use or buy the solution?</p></div>
      <div class="card hl"><div class="kicker">Usability</div><h4>Can they use it?</h4><p>Can they understand and use it without help?</p></div>
      <div class="card hl"><div class="kicker">Feasibility</div><h4>Can we build it?</h4><p>With the technology, time and people we have?</p></div>
      <div class="card hl"><div class="kicker">Business viability</div><h4>Does it make sense?</h4><p>Does it work for the business: cost, legal, operations, brand?</p></div>
    </div>
  </div>

  <div class="block">
    <div class="block-head"><h2>Diamond 1 · The right problem</h2><span>Discover → Define</span></div>
    <div class="grid g2" style="margin-bottom:16px">
      <div class="card">
        <div class="kicker">Understand the problem</div>
        <span class="tag muted">In-depth interviews</span><span class="tag muted">Contextual observation</span><span class="tag muted">Usage data analysis</span><span class="tag muted">Feedback and support analysis</span><span class="tag muted">Jobs to be Done</span>
      </div>
      <div class="card">
        <div class="kicker">Synthesize and choose the opportunity</div>
        <span class="tag muted">Personas</span><span class="tag muted">Journey map</span><span class="tag muted">Opportunity Solution Tree</span><span class="tag muted">Assumption mapping</span>
      </div>
    </div>
    <div class="card side">
      <div class="kicker">Output of diamond 1 · The hypothesis</div>
      <p class="template"><b>We believe that</b> <em>[solution]</em> <b>for</b> <em>[audience]</em> <b>will result in</b> <em>[expected change]</em>. <b>We'll know it worked when</b> <em>[metric]</em> <b>goes from</b> <em>[baseline]</em> <b>to</b> <em>[target]</em>.</p>
    </div>
  </div>

  <div class="block">
    <div class="block-head"><h2>Diamond 2 · The right solution</h2><span>Develop → Deliver</span></div>
    <p class="block-intro">Match the fidelity to the question you want to answer.</p>
    <div class="grid g4" style="margin-bottom:24px">
      <div class="phase"><div class="mode">Minutes</div><h5>Sketch</h5><p>Explore many ideas quickly.</p></div>
      <div class="phase"><div class="mode">Hours</div><h5>Wireframe</h5><p>Structure, hierarchy and flow.</p></div>
      <div class="phase"><div class="mode">Days</div><h5>Clickable prototype</h5><p>Test the flow with users.</p></div>
      <div class="phase"><div class="mode">Days to weeks</div><h5>High fidelity</h5><p>Validate visual details and prepare the handoff.</p></div>
    </div>
    <div class="grid g3">
      <div class="card hl"><div class="kicker">Usability testing</div><h4>Find real problems</h4>
        <ul class="list"><li>Define critical tasks and success criteria</li><li>5 to 8 participants per round reveal most problems</li><li>Measure success, time and errors, and record sessions</li></ul></div>
      <div class="card hl"><div class="kicker">Other validations</div><h4>Test before building</h4>
        <span class="tag muted">Card sorting</span><span class="tag muted">Fake door</span><span class="tag muted">Concierge / Wizard of Oz</span><span class="tag muted">A/B test</span></div>
      <div class="card hl"><div class="kicker">Handoff</div><h4>Handover to development</h4>
        <ul class="list check"><li>States: empty, loading, error and success</li><li>Edge cases and extreme content</li><li>Responsive behavior and interactions</li><li>Final copy and accessibility requirements</li></ul></div>
    </div>
  </div>

  <div class="block">
    <div class="block-head"><h2>What sustains quality</h2><span>Throughout the process</span></div>
    <div class="grid g3">
      <div class="card side"><div class="kicker">Design System</div>
        <ul class="list"><li>Design tokens: color, typography, spacing</li><li>Component library in design and code</li><li>Documentation with usage examples</li><li>Governance: how to contribute and version</li></ul></div>
      <div class="card side"><div class="kicker">Accessibility</div>
        <ul class="list"><li>Reference: WCAG level AA</li><li>Minimum 4.5:1 contrast for text</li><li>Full keyboard navigation</li><li>Alt text, and never rely on color alone</li></ul></div>
      <div class="card side"><div class="kicker">UX metrics</div>
        <ul class="list"><li>Task success rate</li><li>Time on task and error rate</li><li>SUS (System Usability Scale)</li><li>Satisfaction and perceived effort</li></ul></div>
    </div>
  </div>

  <div class="block">
    <div class="block-head"><h2>Examples</h2><span>Illustrative cases</span></div>
    <div class="grid g3">
      <div class="card case hl">
        <h4>Online learning platform</h4>
        <dl>
          <div><dt>Signal</dt><dd>Most students stop watching at the second lesson.</dd></div>
          <div><dt>Discovery</dt><dd>Interviews show many people study while commuting, and 40-minute lessons don't fit that time.</dd></div>
          <div><dt>Solution tested</dt><dd>Lessons in 10-minute blocks, with progress saved automatically.</dd></div>
          <div><dt>Learning</dt><dd>The format has to fit the moment people use the product.</dd></div>
        </dl>
      </div>
      <div class="card case hl">
        <h4>Recipe app</h4>
        <dl>
          <div><dt>Signal</dt><dd>Lots of recipes get saved, but few get cooked.</dd></div>
          <div><dt>Discovery</dt><dd>In-home observation shows the obstacle appears at cooking time: there's always an ingredient missing.</dd></div>
          <div><dt>Solution tested</dt><dd>A shopping list generated from the recipe. A fake door measured interest before building.</dd></div>
          <div><dt>Learning</dt><dd>High intent doesn't guarantee action. You need to remove friction from the next step.</dd></div>
        </dl>
      </div>
      <div class="card case hl">
        <h4>Fitness studio booking app</h4>
        <dl>
          <div><dt>Signal</dt><dd>Many class bookings are cancelled at the last minute.</dd></div>
          <div><dt>Discovery</dt><dd>People book several classes "to secure a spot", because classes fill up fast.</dd></div>
          <div><dt>Solution tested</dt><dd>A waitlist with automatic alerts when a spot opens, tested as a prototype.</dd></div>
          <div><dt>Learning</dt><dd>Unwanted behavior is often a logical response to one of the product's own rules.</dd></div>
        </dl>
      </div>
    </div>
  </div>

  <div class="block">
    <div class="card">
      <div class="kicker">Good practices</div>
      <ul class="list">
        <li><b style="color:var(--text)">Continuous discovery:</b> frequent contact with users, not only at the start of projects.</li>
        <li><b style="color:var(--text)">Product trio:</b> product, design and engineering work together across both diamonds.</li>
        <li><b style="color:var(--text)">Record learnings:</b> evidence, decisions and discarded hypotheses stay accessible to the team.</li>
        <li><b style="color:var(--text)">Dropping early is success:</b> an idea invalidated in a prototype saves weeks of development.</li>
      </ul>
    </div>
  </div>
</section>

<!-- ===================== WORK STRUCTURE ===================== -->
<section class="section" id="estrutura" data-title="Work structure">
  <div class="eyebrow">06 · Delivery</div>
  <h1 class="title">Work <em>structure</em></h1>
  <p class="lede">A shared hierarchy connects strategy to the team's day-to-day work. Names vary between tools; what matters is the relationship between levels.</p>

  <div class="block">
    <div class="block-head"><h2>Hierarchy</h2></div>
    <div class="hier">
      <div class="hier-row"><div><h5>Initiative</h5><p>Strategic bet linked to an OKR, grouping several epics.</p></div><span class="hz">a quarter or more</span></div>
      <div class="hier-row" style="margin-left:24px"><div><h5>Epic</h5><p>A meaningful value delivery, broken down into stories.</p></div><span class="hz">weeks</span></div>
      <div class="hier-row" style="margin-left:48px"><div><h5>Story · Task · Bug</h5><p>A unit of work that fits in one cycle.</p></div><span class="hz">days</span></div>
      <div class="hier-row" style="margin-left:72px"><div><h5>Subtask</h5><p>A technical or operational step of a story.</p></div><span class="hz">hours</span></div>
    </div>
  </div>

  <div class="block grid g2">
    <div class="card side">
      <div class="kicker">User story</div>
      <p class="mono" style="color:var(--text);margin-bottom:12px">As a [persona], I want [action], so that [benefit]</p>
      <p style="font-style:italic">E.g. As an event organizer, I want to export the attendee list, so that I can send it to the venue.</p>
    </div>
    <div class="card side">
      <div class="kicker">Acceptance criteria</div>
      <p class="mono" style="color:var(--text)">Given [context]<br>When [action]<br>Then [expected result]</p>
      <p style="font-style:italic;margin-top:12px">E.g. Given an event with registrations, when I click export, then I get a file with each attendee's name and email.</p>
    </div>
  </div>

  <div class="block">
    <div class="block-head"><h2>INVEST</h2><span>A good story is…</span></div>
    <div class="grid g6">
      <div class="card letter-card"><div class="big">I</div><h5>Independent</h5><p>Can be delivered without depending on another.</p></div>
      <div class="card letter-card"><div class="big">N</div><h5>Negotiable</h5><p>Opens a conversation, not a closed contract.</p></div>
      <div class="card letter-card"><div class="big">V</div><h5>Valuable</h5><p>Delivers noticeable value.</p></div>
      <div class="card letter-card"><div class="big">E</div><h5>Estimable</h5><p>The team understands it well enough to estimate.</p></div>
      <div class="card letter-card"><div class="big">S</div><h5>Small</h5><p>Fits comfortably in one cycle.</p></div>
      <div class="card letter-card"><div class="big">T</div><h5>Testable</h5><p>Has clear acceptance criteria.</p></div>
    </div>
  </div>

  <div class="block grid g3">
    <div class="card"><div class="kicker">Definition of Ready</div><h4>Can start</h4>
      <ul class="list check"><li>Clear value and goal</li><li>Acceptance criteria defined</li><li>Design available, if needed</li><li>Dependencies mapped</li><li>Estimated by the team</li></ul></div>
    <div class="card"><div class="kicker">Definition of Done</div><h4>Is done</h4>
      <ul class="list check"><li>Acceptance criteria met</li><li>Code reviewed and tested</li><li>No open critical bugs</li><li>Documentation updated</li><li>Live in production or ready to release</li></ul></div>
    <div class="card"><div class="kicker">Epic checklist</div><h4>Before breaking it down</h4>
      <ul class="list check"><li>Problem and success metric defined</li><li>Flow mapped and validated</li><li>Prototype tested</li><li>Technical feasibility confirmed</li><li>Stories created with acceptance criteria</li></ul></div>
  </div>

  <div class="block">
    <div class="block-head"><h2>Recommended views</h2></div>
    <span class="tag">Strategic · Initiatives</span><span class="tag">Upstream · Discovery</span><span class="tag">Design</span><span class="tag">Downstream · Delivery</span><span class="tag">Maintenance · Bugs</span>
  </div>
</section>

<!-- ===================== BACKLOG ===================== -->
<section class="section" id="backlog" data-title="Backlog and refinement">
  <div class="eyebrow">07 · Delivery</div>
  <h1 class="title">Backlog and <em>refinement</em></h1>
  <p class="lede">A living, prioritized list of what could create value. A healthy backlog is detailed at the top and more open at the bottom.</p>

  <div class="block">
    <div class="block-head"><h2>The iceberg</h2></div>
    <div class="iceberg">
      <div class="ice i1"><h5>Next cycles</h5><p>Small stories, refined and estimated</p></div>
      <div class="ice i2"><h5>Next months</h5><p>Prioritized epics, partially refined</p></div>
      <div class="ice i3"><h5>Future</h5><p>Opportunities and ideas, with little detail</p></div>
    </div>
  </div>

  <div class="block">
    <div class="block-head"><h2>DEEP</h2><span>Traits of a good backlog</span></div>
    <div class="grid g4">
      <div class="card letter-card"><div class="big">D</div><h5>Detailed appropriately</h5><p>More detail on what comes first.</p></div>
      <div class="card letter-card"><div class="big">E</div><h5>Estimated</h5><p>Top items have estimates.</p></div>
      <div class="card letter-card"><div class="big">E</div><h5>Emergent</h5><p>Changes as you learn.</p></div>
      <div class="card letter-card"><div class="big">P</div><h5>Prioritized</h5><p>The order reflects value and risk.</p></div>
    </div>
  </div>

  <div class="block grid g3">
    <div class="card hl"><div class="kicker">Refinement</div><h4>Prepare what's next</h4>
      <ul class="list"><li>Ongoing, not only right before planning</li><li>Common rule of thumb: up to ~10% of team capacity</li><li>Focus on items for the next 1 to 2 cycles</li></ul></div>
    <div class="card hl"><div class="kicker">Hygiene</div><h4>Keep it lean</h4>
      <ul class="list"><li>Review items that have been idle for a long time</li><li>Archive what's no longer relevant</li><li>Merge duplicates and similar items</li></ul></div>
    <div class="card hl"><div class="kicker">Flow</div><h4>Limit WIP</h4>
      <ul class="list"><li>Fewer items in parallel, faster deliveries</li><li>Finish before starting something new</li><li>Make bottlenecks visible on the board</li></ul></div>
  </div>
</section>

<!-- ===================== ESTIMATION ===================== -->
<section class="section" id="estimativas" data-title="Estimation">
  <div class="eyebrow">08 · Delivery</div>
  <h1 class="title">Collaborative <em>estimation</em></h1>
  <p class="lede">Relative estimates measure effort by considering complexity, risk and uncertainty. They exist to plan and spark conversation, not to enforce deadlines.</p>

  <div class="block grid g2">
    <div class="card">
      <div class="kicker">Story points · Fibonacci</div>
      <div class="fib"><span class="lo">0</span><span class="lo">1</span><span class="lo">2</span><span class="lo">3</span><span>5</span><span>8</span><span class="hi">13</span><span class="hi">20</span><span class="hi">40</span></div>
      <p>The gaps grow with size because uncertainty grows too. Items that are too big should be split.</p>
    </div>
    <div class="card side spidr">
      <div class="kicker">SPIDR · How to split stories</div>
      <p><b>S</b>pikes: investigate first to reduce uncertainty</p>
      <p><b>P</b>aths: one alternative path of the flow at a time</p>
      <p><b>I</b>nterfaces: one channel, device or integration at a time</p>
      <p><b>D</b>ata: one type or subset of data at a time</p>
      <p><b>R</b>ules: one business rule at a time</p>
    </div>
  </div>

  <div class="block">
    <div class="block-head"><h2>Alternatives</h2></div>
    <div class="grid g3">
      <div class="card hl"><div class="kicker">T-shirt sizing</div><h4>XS · S · M · L · XL</h4><p>Good for epics and roadmaps, when precision isn't needed.</p></div>
      <div class="card hl"><div class="kicker">Throughput forecasting</div><h4>Use history</h4><p>Count how many items the team delivers per week and project scenarios from it.</p></div>
      <div class="card hl"><div class="kicker">Right-sizing</div><h4>Similar-sized items</h4><p>Split everything into small, similar pieces and count items instead of points.</p></div>
    </div>
  </div>

  <div class="block">
    <div class="card">
      <div class="kicker">Good practices</div>
      <ul class="list">
        <li>Define reference stories to calibrate what each size means</li>
        <li>Whoever does the work estimates it</li>
        <li>Don't convert points into hours</li>
        <li>Don't compare velocity across teams: each one has its own scale</li>
        <li>Keep sessions short. If it drags, the story needs more refinement</li>
      </ul>
    </div>
  </div>
</section>

<!-- ===================== RITUALS ===================== -->
<section class="section" id="rituais" data-title="Rituals">
  <div class="eyebrow">09 · Delivery</div>
  <h1 class="title">Rituals and <em>ceremonies</em></h1>
  <p class="lede">Meetings with a clear purpose create cadence and transparency. If a ritual produces neither decisions nor learning, change the format.</p>

  <div class="block">
    <div class="block-head"><h2>Cadence</h2><span>Reference for 2-week cycles</span></div>
    <div class="cadence">
      <div class="cad"><div class="freq">Daily</div><p>Daily stand-up</p></div>
      <div class="cad"><div class="freq">Weekly</div><p>Refinement · metrics check-in</p></div>
      <div class="cad"><div class="freq">Per cycle</div><p>Planning · Review · Retrospective</p></div>
      <div class="cad"><div class="freq">Monthly to quarterly</div><p>OKR and roadmap review</p></div>
    </div>
  </div>

  <div class="block grid g3">
    <div class="card hl">
      <div class="cer-head"><h4>Daily</h4><span class="dur">~15 min</span></div>
      <p class="cer-freq">Every day</p>
      <ul class="list"><li>How are we doing against the cycle goal?</li><li>What will we do today?</li><li>Is anything blocking us?</li></ul>
      <p class="tip">To coordinate work, not to report status.</p>
    </div>
    <div class="card hl">
      <div class="cer-head"><h4>Planning</h4><span class="dur">1–2 h</span></div>
      <p class="cer-freq">Start of cycle</p>
      <ul class="list"><li>What is the cycle goal?</li><li>What is the team's real capacity?</li><li>Which items go in?</li></ul>
      <p class="tip">Start with the goal, not the task list.</p>
    </div>
    <div class="card hl">
      <div class="cer-head"><h4>Refinement</h4><span class="dur">~1 h</span></div>
      <p class="cer-freq">Weekly</p>
      <ul class="list"><li>Are the problem and scope clear?</li><li>Are the acceptance criteria complete?</li><li>Does it need splitting?</li></ul>
      <p class="tip">Prepare upcoming cycles ahead of time.</p>
    </div>
    <div class="card hl">
      <div class="cer-head"><h4>Review</h4><span class="dur">30–60 min</span></div>
      <p class="cer-freq">End of cycle</p>
      <ul class="list"><li>What was delivered?</li><li>Working demo</li><li>Stakeholder feedback</li></ul>
      <p class="tip">Show value and outcomes, not tasks.</p>
    </div>
    <div class="card hl">
      <div class="cer-head"><h4>Retrospective</h4><span class="dur">45–90 min</span></div>
      <p class="cer-freq">End of cycle</p>
      <ul class="list"><li>What worked?</li><li>What can we improve?</li><li>Which concrete action will we try?</li></ul>
      <p class="tip">A safe space, few actions, each with an owner.</p>
    </div>
    <div class="card hl">
      <div class="cer-head"><h4>Strategic review</h4><span class="dur">1–2 h</span></div>
      <p class="cer-freq">Monthly or quarterly</p>
      <ul class="list"><li>How are the OKRs doing?</li><li>Does the roadmap still make sense?</li><li>Which blockers need leadership?</li></ul>
      <p class="tip">Connects day-to-day work to strategy.</p>
    </div>
  </div>

  <div class="block">
    <div class="block-head"><h2>Retrospective formats</h2><span>Vary them to keep people engaged</span></div>
    <div class="grid g4">
      <div class="card plain"><h5>Start · Stop · Continue</h5><p>What to start, stop and keep doing.</p></div>
      <div class="card plain"><h5>4Ls</h5><p>Liked, Learned, Lacked, Longed for.</p></div>
      <div class="card plain"><h5>Sailboat</h5><p>Wind (boosts), anchors (drags), rocks (risks) and island (goal).</p></div>
      <div class="card plain"><h5>Timeline</h5><p>Rebuild the cycle and mark the highs and lows.</p></div>
    </div>
  </div>
</section>

<!-- ===================== OUTCOMES ===================== -->
<section class="section" id="resultados" data-title="Measuring outcomes">
  <div class="eyebrow">10 · Learning</div>
  <h1 class="title">Measuring <em>outcomes</em></h1>
  <p class="lede">Shipping is not the end. Measuring impact closes the loop and informs the next decision.</p>

  <div class="quote">If we don't define upfront how to measure success, any result afterwards looks good enough.</div>

  <div class="block">
    <div class="block-head"><h2>Before shipping, define</h2></div>
    <div class="def-row">
      <div><b>Metric</b><span>What will change</span></div>
      <div><b>Baseline</b><span>Current value</span></div>
      <div><b>Target</b><span>Expected value</span></div>
      <div><b>Timeframe</b><span>When to measure</span></div>
      <div><b>Source</b><span>Where the data comes from</span></div>
      <div><b>Owner</b><span>Who tracks it</span></div>
    </div>
  </div>

  <div class="block grid g2">
    <div class="card hl">
      <div class="kicker">North Star Metric</div>
      <h4>One metric that captures the value delivered</h4>
      <p>Shows whether the product is creating value for customers sustainably. It is supported by input metrics that teams can influence.</p>
      <div class="when"><b>Examples</b>Streaming: hours watched · Marketplace: completed transactions · Collaboration tool: weekly active teams</div>
    </div>
    <div class="card hl">
      <div class="kicker">Indicators</div>
      <h4>Leading and lagging</h4>
      <p><b style="color:var(--text)">Leading:</b> change quickly and predict the outcome. E.g. first-week activation.</p>
      <p><b style="color:var(--text)">Lagging:</b> confirm the outcome, but take time to show. E.g. annual retention, revenue.</p>
    </div>
  </div>

  <div class="block">
    <div class="block-head"><h2>HEART</h2><span>User-centered metrics</span></div>
    <div class="grid g5">
      <div class="card letter-card"><div class="big">H</div><h5>Happiness</h5><p>Satisfaction and perception</p><p class="ex">NPS, CSAT</p></div>
      <div class="card letter-card"><div class="big">E</div><h5>Engagement</h5><p>Intensity of use</p><p class="ex">Sessions per week</p></div>
      <div class="card letter-card"><div class="big">A</div><h5>Adoption</h5><p>New users of something</p><p class="ex">% who used the feature</p></div>
      <div class="card letter-card"><div class="big">R</div><h5>Retention</h5><p>Who comes back</p><p class="ex">D30 retention</p></div>
      <div class="card letter-card"><div class="big">T</div><h5>Task success</h5><p>Efficiency and effectiveness</p><p class="ex">Completion rate</p></div>
    </div>
    <p class="block-intro" style="margin-top:14px">For each dimension: <b style="color:var(--text)">Goal</b> → <b style="color:var(--text)">Signal</b> that shows progress → <b style="color:var(--text)">Metric</b> that measures the signal.</p>
  </div>

  <div class="block">
    <div class="block-head"><h2>AARRR</h2><span>Lifecycle funnel</span></div>
    <div class="grid g5">
      <div class="phase"><div class="mode">01</div><h5>Acquisition</h5><p>How people arrive</p></div>
      <div class="phase"><div class="mode">02</div><h5>Activation</h5><p>First experience of value</p></div>
      <div class="phase"><div class="mode">03</div><h5>Retention</h5><p>They come back</p></div>
      <div class="phase"><div class="mode">04</div><h5>Revenue</h5><p>They create value for the business</p></div>
      <div class="phase"><div class="mode">05</div><h5>Referral</h5><p>They recommend it to others</p></div>
    </div>
  </div>

  <div class="block">
    <div class="block-head"><h2>Flow metrics</h2><span>Delivery health</span></div>
    <div class="grid g4">
      <div class="card"><div class="kicker">Lead time</div><p>From request to delivery. The time the customer perceives.</p></div>
      <div class="card"><div class="kicker">Cycle time</div><p>From starting work to completion.</p></div>
      <div class="card"><div class="kicker">Throughput</div><p>Items completed per period.</p></div>
      <div class="card"><div class="kicker">WIP</div><p>Items in progress at the same time.</p></div>
    </div>
  </div>

  <div class="block grid g2">
    <div class="card">
      <div class="kicker">Tracking routine</div>
      <div class="steps">
        <div class="step"><span class="step-n">W</span><div><h5>Weekly</h5><p>Team metrics and KR check-in.</p></div></div>
        <div class="step"><span class="step-n">M</span><div><h5>Monthly</h5><p>Trends, learnings and initiative adjustments.</p></div></div>
        <div class="step"><span class="step-n">Q</span><div><h5>Quarterly</h5><p>OKR close-out and strategy review.</p></div></div>
      </div>
    </div>
    <div class="card" style="border-left:1px solid var(--bad)">
      <div class="kicker" style="color:var(--bad)">Anti-patterns</div>
      <ul class="list">
        <li>Vanity metrics that only go up and don't guide decisions</li>
        <li>Measuring only output: features, tasks, points</li>
        <li>Metrics with no owner and no reading routine</li>
        <li>Measuring everything and acting on nothing</li>
      </ul>
    </div>
  </div>
</section>

<!-- ===================== GLOSSARY ===================== -->
<section class="section" id="glossario" data-title="Glossary">
  <div class="eyebrow">11 · Reference</div>
  <h1 class="title">Glossary of <em>terms</em></h1>
  <p class="lede">A shared language for product, design, engineering and business.</p>

  <div class="gloss-filter"><input type="search" id="glossFilter" placeholder="Filter terms…" aria-label="Filter terms"></div>
  <div class="gloss-grid" id="glossGrid">
    <div class="term"><h5>Acceptance criteria</h5><p>Conditions that define when a story meets expectations.</p></div>
    <div class="term"><h5>Agile</h5><p>An iterative approach, with incremental delivery and continuous adaptation based on feedback.</p></div>
    <div class="term"><h5>Backlog</h5><p>An ordered, living list of items that could create value for the product.</p></div>
    <div class="term"><h5>Baseline</h5><p>The current value of a metric, the starting point for measuring change.</p></div>
    <div class="term"><h5>Cycle time</h5><p>Time between starting work on an item and finishing it.</p></div>
    <div class="term"><h5>Definition of Done</h5><p>Team agreement on what it means for an item to be done.</p></div>
    <div class="term"><h5>Definition of Ready</h5><p>Agreement on what an item needs before development can start.</p></div>
    <div class="term"><h5>Discovery</h5><p>Investigation to understand problems and validate solutions before building.</p></div>
    <div class="term"><h5>Downstream</h5><p>The execution track: detailing, development, testing and delivery.</p></div>
    <div class="term"><h5>Epic</h5><p>A meaningful value delivery, split into smaller stories.</p></div>
    <div class="term"><h5>Hypothesis</h5><p>An explicit, testable assumption about the effect of a solution.</p></div>
    <div class="term"><h5>Initiative</h5><p>A strategic bet linked to an objective, grouping epics.</p></div>
    <div class="term"><h5>Key Result</h5><p>A measurable result that shows progress toward an objective.</p></div>
    <div class="term"><h5>Lead time</h5><p>Time between requesting an item and delivering it to the customer.</p></div>
    <div class="term"><h5>MVP</h5><p>The smallest version of a solution that can produce validated learning.</p></div>
    <div class="term"><h5>North Star Metric</h5><p>The main metric representing the value delivered to customers.</p></div>
    <div class="term"><h5>Objective</h5><p>A qualitative, inspiring description of what you want to achieve.</p></div>
    <div class="term"><h5>Outcome</h5><p>A change in behavior or in a metric caused by a delivery.</p></div>
    <div class="term"><h5>Output</h5><p>What was produced: features, screens, documents.</p></div>
    <div class="term"><h5>Product trio</h5><p>Product, design and engineering working together on discovery.</p></div>
    <div class="term"><h5>Refinement</h5><p>The ongoing work of clarifying, splitting and estimating backlog items.</p></div>
    <div class="term"><h5>Roadmap</h5><p>A communication of the product's direction over time.</p></div>
    <div class="term"><h5>Sprint</h5><p>A fixed-length work cycle, usually 1 to 4 weeks.</p></div>
    <div class="term"><h5>Story points</h5><p>A relative measure of effort, complexity and uncertainty.</p></div>
    <div class="term"><h5>Throughput</h5><p>Number of items completed in a period.</p></div>
    <div class="term"><h5>Upstream</h5><p>The conception track: exploration, discovery and validation.</p></div>
    <div class="term"><h5>User story</h5><p>A short description of a need, from the user's point of view.</p></div>
    <div class="term"><h5>UX · UI</h5><p>User experience (behavior and journey) and user interface (visual layer).</p></div>
    <div class="term"><h5>Velocity</h5><p>Average points completed per cycle, used only by the team itself.</p></div>
    <div class="term"><h5>WIP</h5><p>Work in progress: items being worked on at the same time.</p></div>
  </div>
  <p class="gloss-empty" id="glossEmpty">No terms found.</p>
</section>

</template>

<footer class="footer">
  <span id="footNote"><em>Guia de práticas de produto</em> · documento vivo, adapte ao contexto do seu time</span>
  <span>Thayná Bordin · Product Ops &amp; DesignOps</span>
</footer>

<script>
(function () {
  const I18N = {
    pt: { brand: 'Guia de práticas <em>de produto</em>', title: 'Guia de Práticas de Produto', search: 'Buscar no guia…',
          prev: '← Anterior', next: 'Próximo →', empty: 'Nada encontrado para essa busca.', menu: 'Abrir menu', nav: 'Seções',
          home: '← Portal',
          foot: '<em>Guia de práticas de produto</em> · documento vivo, adapte ao contexto do seu time', locale: 'pt-BR', html: 'pt-BR' },
    en: { brand: 'Product practices <em>guide</em>', title: 'Product Practices Guide', search: 'Search the guide…',
          prev: '← Previous', next: 'Next →', empty: 'Nothing found for this search.', menu: 'Open menu', nav: 'Sections',
          home: '← Portal',
          foot: '<em>Product practices guide</em> · a living document, adapt it to your team’s context', locale: 'en-US', html: 'en' }
  };
  const $ = id => document.getElementById(id);
  const body = document.body, sidebar = $('sidebar'), content = $('content');
  const input = $('searchInput'), box = $('results');
  const norm = s => s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
  const esc = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  let lang = 'pt', sections = [], order = [], navItems = [], index = [], current = [], focusIdx = -1;

  function pickLang() {
    const q = new URLSearchParams(location.search).get('lang');
    if (q === 'pt' || q === 'en') return q;
    try { const s = localStorage.getItem('guide-lang'); if (s === 'pt' || s === 'en') return s; } catch (e) {}
    return (navigator.language || 'pt').toLowerCase().startsWith('pt') ? 'pt' : 'en';
  }

  function setUrl(id) {
    const url = new URL(location.href);
    url.searchParams.set('lang', lang);
    url.hash = id;
    history.replaceState(null, '', url);
  }

  function show(id, opts = {}) {
    if (!order.includes(id)) id = 'inicio';
    sections.forEach(s => s.classList.toggle('active', s.dataset.id === id));
    navItems.forEach(n => n.classList.toggle('active', n.dataset.go === id));
    setUrl(id);
    const sec = sections.find(s => s.dataset.id === id);
    document.title = (id === 'inicio' ? '' : sec.dataset.title + ' · ') + I18N[lang].title;
    body.classList.remove('nav-open');
    if (!opts.keepScroll) window.scrollTo({ top: 0, behavior: 'auto' });
  }

  function rice() {
    if (!$('rReach')) return;
    const v = id => parseFloat($(id).value) || 0;
    const effort = v('rEffort');
    const score = effort > 0 ? (v('rReach') * v('rImpact') * v('rConf')) / effort : 0;
    $('rScore').textContent = score.toLocaleString(I18N[lang].locale, { maximumFractionDigits: 1 });
  }

  function filterGlossary() {
    const q = norm(($('glossFilter') || { value: '' }).value.trim());
    let visible = 0;
    document.querySelectorAll('#glossGrid .term').forEach(t => {
      const ok = !q || norm(t.textContent).includes(q);
      t.style.display = ok ? '' : 'none';
      if (ok) visible++;
    });
    if ($('glossEmpty')) $('glossEmpty').style.display = visible ? 'none' : 'block';
  }

  function render(newLang, keepId) {
    lang = newLang;
    const t = I18N[lang];
    sidebar.innerHTML = $('tpl-nav-' + lang).innerHTML;
    content.innerHTML = $('tpl-main-' + lang).innerHTML;
    document.documentElement.lang = t.html;
    $('brand').innerHTML = t.brand;
    $('homeLink').textContent = t.home;
    $('homeLink').href = './?lang=' + lang;
    sidebar.querySelectorAll('.nav-home a').forEach(a => { a.href = './?lang=' + lang; });
    $('footNote').innerHTML = t.foot;
    input.placeholder = t.search; input.setAttribute('aria-label', t.search);
    $('menuBtn').setAttribute('aria-label', t.menu);
    sidebar.setAttribute('aria-label', t.nav);
    document.querySelectorAll('.lang button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.lang === lang)));
    try { localStorage.setItem('guide-lang', lang); } catch (e) {}

    sections = Array.from(content.querySelectorAll('.section'));
    // keep section ids out of the DOM so the browser never jumps to the #hash on its own
    sections.forEach(sec => { sec.dataset.id = sec.id; sec.removeAttribute('id'); });
    order = sections.map(s => s.dataset.id);
    navItems = Array.from(sidebar.querySelectorAll('.nav-item'));

    sections.forEach((sec, i) => {
      const pager = document.createElement('div');
      pager.className = 'pager';
      const prev = sections[i - 1], next = sections[i + 1];
      if (prev) pager.innerHTML += `<button class="prev" data-go="${prev.dataset.id}"><small>${t.prev}</small><span>${prev.dataset.title}</span></button>`;
      if (next) pager.innerHTML += `<button class="next" data-go="${next.dataset.id}"><small>${t.next}</small><span>${next.dataset.title}</span></button>`;
      sec.appendChild(pager);
    });

    index = [];
    sections.forEach(sec => {
      sec.querySelectorAll('h4, h5, p, li, td, .tag, dd').forEach(el => {
        if (el.closest('.pager')) return;
        const txt = el.textContent.replace(/\s+/g, ' ').trim();
        if (txt.length < 3) return;
        index.push({ id: sec.dataset.id, title: sec.dataset.title, el, txt, n: norm(txt) });
      });
    });

    input.value = ''; box.classList.remove('open'); box.innerHTML = '';
    rice();
    show(keepId || 'inicio', { keepScroll: false });
  }

  // Navigation
  document.addEventListener('click', e => {
    const l = e.target.closest('.lang button');
    if (l) { if (l.dataset.lang !== lang) render(l.dataset.lang, location.hash.slice(1)); return; }
    const t = e.target.closest('[data-go]');
    if (t) { e.preventDefault(); show(t.dataset.go); }
  });
  window.addEventListener('hashchange', () => show(location.hash.slice(1)));
  $('menuBtn').addEventListener('click', () => body.classList.toggle('nav-open'));
  $('overlay').addEventListener('click', () => body.classList.remove('nav-open'));

  // Delegated inputs (RICE + glossary)
  document.addEventListener('input', e => {
    if (['rReach', 'rImpact', 'rConf', 'rEffort'].includes(e.target.id)) rice();
    if (e.target.id === 'glossFilter') filterGlossary();
  });

  // Search
  function snippet(txt, n, q) {
    const i = n.indexOf(q);
    const start = Math.max(0, i - 40), end = Math.min(txt.length, i + q.length + 60);
    return (start > 0 ? '…' : '') + esc(txt.slice(start, i)) + '<mark>' + esc(txt.slice(i, i + q.length)) + '</mark>' + esc(txt.slice(i + q.length, end)) + (end < txt.length ? '…' : '');
  }
  function search() {
    const q = norm(input.value.trim());
    focusIdx = -1;
    if (q.length < 2) { box.classList.remove('open'); box.innerHTML = ''; current = []; return; }
    const seen = new Set();
    current = index.filter(it => {
      if (!it.n.includes(q)) return false;
      const key = it.id + '|' + it.n;
      if (seen.has(key)) return false;
      seen.add(key); return true;
    }).slice(0, 10);
    box.innerHTML = current.length
      ? current.map((it, i) => `<button class="result" data-i="${i}"><div class="result-sec">${esc(it.title)}</div><div class="result-txt">${snippet(it.txt, it.n, q)}</div></button>`).join('')
      : `<div class="result-empty">${I18N[lang].empty}</div>`;
    box.classList.add('open');
  }
  function openResult(i) {
    const it = current[i];
    if (!it) return;
    show(it.id, { keepScroll: true });
    box.classList.remove('open');
    input.blur();
    requestAnimationFrame(() => {
      const y = it.el.getBoundingClientRect().top + window.scrollY - 120;
      window.scrollTo({ top: y, behavior: 'smooth' });
      it.el.classList.remove('flash'); void it.el.offsetWidth; it.el.classList.add('flash');
    });
  }
  input.addEventListener('input', search);
  input.addEventListener('focus', () => { if (input.value.trim().length >= 2) search(); });
  box.addEventListener('click', e => {
    const b = e.target.closest('.result');
    if (b) { e.stopPropagation(); openResult(+b.dataset.i); }
  });
  input.addEventListener('keydown', e => {
    const items = box.querySelectorAll('.result');
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault();
      if (!items.length) return;
      focusIdx = (focusIdx + (e.key === 'ArrowDown' ? 1 : -1) + items.length) % items.length;
      items.forEach((b, i) => b.classList.toggle('focus', i === focusIdx));
    } else if (e.key === 'Enter') {
      e.preventDefault();
      openResult(focusIdx >= 0 ? focusIdx : 0);
    } else if (e.key === 'Escape') {
      input.value = ''; box.classList.remove('open'); input.blur();
    }
  });
  document.addEventListener('click', e => { if (!e.target.closest('.search')) box.classList.remove('open'); });
  document.addEventListener('keydown', e => {
    const typing = /INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName);
    if (e.key === '/' && !typing) { e.preventDefault(); input.focus(); }
  });

  if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
  render(pickLang(), location.hash.slice(1));
})();
</script>
</body>
</html>
