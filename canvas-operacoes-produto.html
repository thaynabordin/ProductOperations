<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Canvas de Operações de Produto</title>
<meta name="description" content="Mapeie a saúde da operação de produto em 6 áreas, avalie cada uma e receba uma leitura de onde agir primeiro.">
<meta name="theme-color" content="#111118">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="creations.css">
<style>
  /* ---------- Específico do Canvas ---------- */
  :root { --healthy: var(--good); --attention: var(--accent); --critical: var(--bad); }

  .area-card { display: flex; flex-direction: column; text-align: left; min-height: 210px; transition: background .2s, border-color .2s; }
  .area-card:hover, .area-card:focus-visible { background: var(--surface-2); border-color: var(--accent-line); outline: none; }
  .area-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
  .area-top .kicker { margin: 0; }
  .area-card p { flex: 1; }
  .area-foot { margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--line); font-size: 13px; letter-spacing: .16em; text-transform: uppercase; color: var(--accent); display: flex; justify-content: space-between; gap: 8px; }
  .area-foot .note { color: var(--muted); }

  .progress { display: flex; align-items: center; gap: 20px; flex-wrap: wrap; }
  .progress-label { font-size: 13px; letter-spacing: .2em; text-transform: uppercase; color: var(--muted); }
  .progress-track { flex: 1; min-width: 160px; height: 3px; background: var(--line-2); }
  .progress-fill { height: 100%; background: var(--accent); transition: width .3s; }

  .opt { text-align: center; padding: 28px 16px; border: 1px solid var(--line); background: var(--surface); transition: background .2s, border-color .2s; }
  .opt:hover { border-color: var(--accent-line); }
  .opt-sym { font-size: 28px; line-height: 1; color: var(--muted); margin-bottom: 10px; }
  .opt-lbl { font-size: 13px; letter-spacing: .18em; text-transform: uppercase; color: var(--text-2); }

  textarea.notes {
    width: 100%; min-height: 120px; background: var(--surface); border: 1px solid var(--line-2); color: var(--text);
    padding: 16px 18px; font-size: 16px; line-height: 1.6; resize: vertical; outline: none; border-radius: 0;
  }
  textarea.notes:focus { border-color: var(--accent); }
  textarea.notes::placeholder { color: var(--muted); }

  .summary-num { font-family: var(--serif); font-size: 56px; line-height: 1; margin-bottom: 6px; }
  .summary-lbl { font-size: 13px; letter-spacing: .2em; text-transform: uppercase; }
  .bar { display: flex; height: 4px; gap: 3px; margin: 16px 0 48px; }
  .group-row { display: grid; grid-template-columns: 56px 1fr; gap: 12px; align-items: baseline; padding: 16px 20px; margin-bottom: 8px; background: var(--surface); border: 1px solid var(--line); }
  .group-row .code { font-size: 13px; letter-spacing: .16em; }
  .group-row h5 { font-size: 16px; font-weight: 600; }
  .group-row .row-note { grid-column: 2; font-family: var(--serif); font-style: italic; font-size: 18px; color: var(--text-2); white-space: pre-wrap; }
  .empty { border-style: dashed; text-align: center; padding: 56px 24px; }
  .empty .kicker { margin-bottom: 12px; }
  .empty p { margin-bottom: 24px; }
</style>
</head>
<body>

<header class="header">
  <button class="menu-btn" id="menuBtn" aria-label="Abrir menu">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><line x1="3" y1="7" x2="21" y2="7"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="17" x2="21" y2="17"/></svg>
  </button>
  <a class="home-link" id="homeLink" href="./">← Portal</a>
  <div class="brand" id="brand"></div>
  <div class="header-spacer"></div>
  <div class="lang" role="group" aria-label="Idioma / Language">
    <button type="button" data-lang="pt" aria-pressed="true">PT</button>
    <button type="button" data-lang="en" aria-pressed="false">EN</button>
  </div>
</header>

<nav class="sidebar" id="sidebar"></nav>
<div class="overlay" id="overlay"></div>

<main class="main">
  <div class="content" id="content"></div>
</main>

<footer class="footer">
  <span id="footNote"></span>
  <span>Thayná Bordin · Product Ops &amp; DesignOps</span>
</footer>

    { id: "people", label: "Pessoas & Capacitação", code: "PES",

  en: [

    { id: "tools", label: "Tools & Systems", code: "TLS",
      prompt: "Does the tooling ecosystem help or hinder?",
      description: "All tools used by the product team — backlog management, documentation, communication, data analysis, design.",
      questions: ["Do tools talk to each other or create information silos?", "Does the team use tools consistently?", "Is there a single source of truth for each type of information?", "Can new people find their way around the ecosystem quickly?"] },
    { id: "metrics", label: "Metrics & Indicators", code: "MET",
      prompt: "Do you measure what matters or what's easy?",
      description: "The indicators the team tracks to make decisions — product, experience, operations and business metrics.",
      questions: ["Is it clear which metrics matter for each decision?", "Are metrics accessible to the whole team or held by a few?", "Are user experience indicators part of the tracking?", "Do data points influence real decisions or just decorate presentations?"] },
    { id: "governance", label: "Governance & Decision-Making", code: "GOV",
      prompt: "Is it clear who decides what and how?",
      description: "The decision-making model — who prioritizes, who approves, how conflicts are resolved, how trade-offs are made.",
      questions: ["Is it clear who has authority over each type of decision?", "Are there explicit prioritization criteria or does it depend on who speaks loudest?", "Do cross-team conflicts have a clear resolution path?", "Are important decisions recorded with context and rationale?"] },
    { id: "people", label: "People & Enablement", code: "PPL",
      prompt: "Does the team have what it needs to grow and deliver?",
      description: "Team structure, roles, competencies, onboarding, professional development and retention.",
      questions: ["Are roles and responsibilities clear to everyone?", "Is onboarding structured or left to chance?", "Is there investment in competency development?", "Does the team have enough autonomy or is it over-dependent on approvals?"] },
    { id: "alignment", label: "Communication & Alignment", code: "COM",
      prompt: "Does the right info reach the right person at the right time?",
      description: "How the team communicates internally and with partner areas — rituals, channels, documentation, work visibility.",
      questions: ["Does everyone know what others are working on?", "Is communication between product, design and engineering fluid?", "Are there effective rituals or meetings that could be a document?", "Do partner areas (business, support, sales) have visibility into product?"] },
  ],
};

const HEALTH_COLORS = { healthy: "var(--healthy)", attention: "var(--attention)", critical: "var(--critical)" };
const HEALTH_OPTIONS = {
  pt: [
    { value: "healthy", label: "Saudável", symbol: "●" },
    { value: "attention", label: "Atenção", symbol: "◐" },
    { value: "critical", label: "Crítico", symbol: "○" },
  ],
  en: [
    { value: "healthy", label: "Healthy", symbol: "●" },
    { value: "attention", label: "Needs attention", symbol: "◐" },
    { value: "critical", label: "Critical", symbol: "○" },
  ],
};

const UI = {
  pt: {
    docTitle: "Canvas de Operações de Produto",
    brand: "Canvas de operações <em>de produto</em>",
    home: "← Portal", homeNav: "Portal de criações", menu: "Abrir menu", nav: "Seções",
    navOverview: "Visão geral", navCanvas: "Canvas", navAreas: "Áreas", navResult: "Resultado", navReading: "Leitura",
    eyebrow: "Product Ops · Diagnóstico",
    title: "Canvas de operações de <em>produto</em>",
    lede: "Mapeie a saúde da operação em 6 áreas. Avalie, anote e identifique onde agir.",

    evaluate: "Avaliar →", noted: "✎ com anotação",
    mapped: "áreas mapeadas", seeReading: "Ver leitura completa →",
    areaOf: (i, n) => `Área ${i} de ${n}`,
    diagnosticQ: "Perguntas diagnósticas", assessment: "Avaliação", assessmentHint: "Como essa área está hoje?",
    notes: "Anotações", notesPlaceholder: "Gargalos, observações, ideias...",
    saveBack: "Salvar e voltar ao canvas", backNoSave: "Voltar sem avaliar",
    prev: "← Anterior", next: "Próxima →",
    readingEyebrow: "Resultado", readingTitle: "Leitura do <em>canvas</em>",

    insufficient: "Dados insuficientes",
    insufficientDesc: n => `Avalie as ${n} áreas restantes no canvas para gerar a leitura completa.`,
    goCanvas: "Ir ao canvas", reading: "Leitura", reset: "Limpar e recomeçar",

      "A operação funciona mas acumula pontos de atrito. O risco é normalizar o desconforto. Escolha a área de maior impacto no dia a dia e trate com intenção.",
      "Operação em boa forma. O desafio agora é sustentar e evoluir. Revise este canvas a cada trimestre pra identificar regressões antes que virem crises.",
    ],
  },
  en: {
    docTitle: "Product Operations Canvas",
    brand: "Product operations <em>canvas</em>",
    home: "← Portal", homeNav: "Creations portal", menu: "Open menu", nav: "Sections",
    navOverview: "Overview", navCanvas: "Canvas", navAreas: "Areas", navResult: "Result", navReading: "Reading",
    eyebrow: "Product Ops · Assessment",
    title: "Product operations <em>canvas</em>",

    areaOf: (i, n) => `Area ${i} of ${n}`,
    diagnosticQ: "Diagnostic questions", assessment: "Assessment", assessmentHint: "How is this area doing today?",
    notes: "Notes", notesPlaceholder: "Bottlenecks, observations, ideas...",
    saveBack: "Save and back to canvas", backNoSave: "Back without assessing",
    prev: "← Previous", next: "Next →",

    readingLede: "How the 6 areas split between healthy, needs attention and critical, and where to start.",

    ],
  },
};

// Idioma: ?lang= no endereço, depois a última escolha salva no portal, depois o idioma do navegador
function pickLang() {
  const q = new URLSearchParams(location.search).get("lang");
  if (q === "pt" || q === "en") return q;
  try { const s = localStorage.getItem("portal-lang"); if (s === "pt" || s === "en") return s; } catch (e) {}
  return (navigator.language || "pt").toLowerCase().startsWith("pt") ? "pt" : "en";
}

const state = { lang: pickLang(), view: "canvas", health: {}, notes: {} };
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const opts = () => HEALTH_OPTIONS[state.lang].map(o => ({ ...o, color: HEALTH_COLORS[o.value] }));
const optOf = v => opts().find(o => o.value === v);

function sidebarView(t, areas) {
  const assessed = Object.keys(state.health).length;
  const item = (go, num, label, extra = "") =>
    `<button class="nav-item${state.view === go ? " active" : ""}" data-go="${go}"><span class="nav-num">${num}</span>${label}${extra}</button>`;
  return `
    <div class="nav-home"><a class="nav-item" href="./?lang=${state.lang}"><span class="nav-num">←</span>${t.homeNav}</a></div>
    <div class="nav-group">
      <div class="nav-label">${t.navOverview}</div>
      ${item("canvas", "—", t.navCanvas)}
    </div>
    <div class="nav-group">
      <div class="nav-label">${t.navAreas}</div>
      ${areas.map((a, i) => {
        const o = state.health[a.id] && optOf(state.health[a.id]);
        return item(a.id, String(i + 1).padStart(2, "0"), esc(a.label), o ? `<span class="nav-status" style="color:${o.color}">${o.symbol}</span>` : "");
      }).join("")}
    </div>
    <div class="nav-group">
      <div class="nav-label">${t.navResult}</div>
      ${item("reading", "→", t.navReading, `<span class="nav-status" style="color:var(--muted)">${assessed}/${areas.length}</span>`)}
    </div>`;
}

function canvasView(t, areas) {
  const assessed = Object.keys(state.health).length;
  const cards = areas.map(a => {
    const o = state.health[a.id] && optOf(state.health[a.id]);
    const style = o ? `style="border-top:1px solid ${o.color}"` : "";
    return `
      <button class="card area-card" data-go="${a.id}" ${style}>
        <div class="area-top">
          <span class="kicker">${a.code}</span>
          ${o ? `<span style="color:${o.color}">${o.symbol}</span>` : ""}
        </div>
        <h4>${esc(a.label)}</h4>
        <p>${esc(a.prompt)}</p>
        <div class="area-foot">
          ${o ? `<span style="color:${o.color}">${o.label}</span>` : `<span>${t.evaluate}</span>`}
          ${state.notes[a.id] ? `<span class="note">${t.noted}</span>` : ""}
        </div>
      </button>`;
  }).join("");
  return `
    <div class="eyebrow">${t.eyebrow}</div>
    <h1 class="title display">${t.title}</h1>
    <p class="lede">${t.lede}</p>
    <div class="block">
      <div class="block-head"><h2>${t.areasHead}</h2><span>${t.areasHint}</span></div>
      <div class="grid g3">${cards}</div>
    </div>
    <div class="block">
      <div class="progress">
        <span class="progress-label">${assessed}/${areas.length} ${t.mapped}</span>
        <div class="progress-track"><div class="progress-fill" style="width:${(assessed / areas.length) * 100}%"></div></div>
        ${assessed === areas.length ? `<button class="btn primary" data-go="reading">${t.seeReading}</button>` : ""}
      </div>
    </div>`;
}

function areaView(t, areas, idx) {
  const a = areas[idx];
  const current = state.health[a.id];
  const prev = areas[idx - 1], next = areas[idx + 1];
  const options = opts().map(o => {
    const sel = current === o.value;
    const st = sel ? `style="border-color:${o.color};background:var(--accent-soft)"` : "";
    return `
      <button class="opt" data-health="${o.value}" aria-pressed="${sel}" ${st}>
        <div class="opt-sym" style="${sel ? `color:${o.color}` : ""}">${o.symbol}</div>
        <div class="opt-lbl" style="${sel ? `color:${o.color}` : ""}">${o.label}</div>
      </button>`;
  }).join("");
  return `
    <div class="eyebrow">${a.code} · ${t.areaOf(idx + 1, areas.length)}</div>
    <h1 class="title">${esc(a.label)}</h1>
    <p class="lede">${esc(a.description)}</p>
    <div class="block">
      <div class="block-head"><h2>${t.diagnosticQ}</h2></div>
      <div class="card"><div class="steps">
        ${a.questions.map((q, i) => `<div class="step"><span class="step-n">${String(i + 1).padStart(2, "0")}</span><p>${esc(q)}</p></div>`).join("")}
      </div></div>
    </div>
    <div class="block">
      <div class="block-head"><h2>${t.assessment}</h2><span>${t.assessmentHint}</span></div>
      <div class="grid g3">${options}</div>
    </div>
    <div class="block">
      <div class="block-head"><h2>${t.notes}</h2></div>
      <textarea class="notes" id="notes" placeholder="${esc(t.notesPlaceholder)}">${esc(state.notes[a.id] || "")}</textarea>
    </div>
    <div class="actions">
      <button class="btn ${current ? "primary" : "ghost"}" data-go="canvas">${current ? t.saveBack : t.backNoSave}</button>
    </div>
    <div class="pager">
      ${prev ? `<button class="prev" data-go="${prev.id}"><small>${t.prev}</small><span>${esc(prev.label)}</span></button>` : ""}
      ${next ? `<button class="next" data-go="${next.id}"><small>${t.next}</small><span>${esc(next.label)}</span></button>`
             : `<button class="next" data-go="reading"><small>${t.next}</small><span>${t.navReading}</span></button>`}
    </div>`;
}

function readingView(t, areas) {
  const assessed = Object.keys(state.health).length;
  const head = `
    <div class="eyebrow">${t.readingEyebrow}</div>
    <h1 class="title">${t.readingTitle}</h1>
    <p class="lede">${t.readingLede}</p>`;
  if (assessed < areas.length) {
    return head + `
      <div class="card empty">
        <div class="kicker">${t.insufficient}</div>
        <p>${t.insufficientDesc(areas.length - assessed)}</p>
        <button class="btn" data-go="canvas">${t.goCanvas}</button>
      </div>`;
  }
  const sum = { healthy: 0, attention: 0, critical: 0 };
  Object.values(state.health).forEach(v => sum[v]++);
  const interp = sum.critical >= 3 ? t.interp[0] : sum.critical >= 1 ? t.interp[1] : sum.attention >= 3 ? t.interp[2] : t.interp[3];
  const o = opts();
  const summary = o.map(x => `
    <div class="card" style="border-top:1px solid ${x.color}">
      <div class="summary-num" style="color:${x.color}">${sum[x.value]}</div>
      <div class="summary-lbl" style="color:${x.color}">${x.symbol} ${x.label}</div>
    </div>`).join("");
  const bar = o.filter(x => sum[x.value]).map(x => `<div style="flex:${sum[x.value]};background:${x.color}"></div>`).join("");
  const groups = ["critical", "attention", "healthy"].map(hv => {
    const list = areas.filter(a => state.health[a.id] === hv);
    if (!list.length) return "";
    const x = optOf(hv);
    return `
      <div class="block">
        <div class="block-head"><h2 style="color:${x.color}">${x.symbol} ${x.label}</h2></div>
        ${list.map(a => `
          <div class="group-row" style="border-left:2px solid ${x.color}">
            <span class="code" style="color:${x.color}">${a.code}</span>
            <h5>${esc(a.label)}</h5>
            ${state.notes[a.id] ? `<p class="row-note">${esc(state.notes[a.id])}</p>` : ""}
          </div>`).join("")}
      </div>`;
  }).join("");
  return head + `
    <div class="grid g3">${summary}</div>
    <div class="bar">${bar}</div>
    ${groups}
    <div class="block">
      <div class="kicker">${t.reading}</div>
      <p class="quote">${interp}</p>
    </div>
    <div class="actions"><button class="btn ghost" data-reset>${t.reset}</button></div>`;
}

let lastView = null;
function render() {
  const t = UI[state.lang];
  const areas = AREAS[state.lang];
  const idx = areas.findIndex(a => a.id === state.view);
  document.documentElement.lang = state.lang === "pt" ? "pt-BR" : "en";
  document.title = t.docTitle;
  $("brand").innerHTML = t.brand;
  $("homeLink").textContent = t.home;
  $("homeLink").href = "./?lang=" + state.lang;
  $("footNote").innerHTML = t.foot;
  $("menuBtn").setAttribute("aria-label", t.menu);
  $("sidebar").setAttribute("aria-label", t.nav);
  document.querySelectorAll(".lang button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === state.lang)));
  $("sidebar").innerHTML = sidebarView(t, areas);
  const body = state.view === "reading" ? readingView(t, areas) : idx >= 0 ? areaView(t, areas, idx) : canvasView(t, areas);
  // A animação de entrada só roda ao trocar de seção, não a cada resposta
  const animate = state.view !== lastView;
  lastView = state.view;
  $("content").innerHTML = `<div class="${animate ? "view" : ""}">${body}</div>`;
}

function go(view) {
  state.view = view;
  document.body.classList.remove("nav-open");
  render();
  window.scrollTo({ top: 0, behavior: "auto" });
}

function setLang(next) {
  if (next === state.lang) return;
  state.lang = next;
  try { localStorage.setItem("portal-lang", next); } catch (e) {}
  const url = new URL(location.href);
  url.searchParams.set("lang", next);
  history.replaceState(null, "", url);
  render();
}

document.addEventListener("click", e => {
  const l = e.target.closest(".lang button");
  if (l) { setLang(l.dataset.lang); return; }
  const g = e.target.closest("[data-go]");
  if (g) { go(g.dataset.go); return; }
  const h = e.target.closest("[data-health]");
  if (h) {
    const areas = AREAS[state.lang];
    if (areas.some(a => a.id === state.view)) { state.health = { ...state.health, [state.view]: h.dataset.health }; render(); }
    return;
  }
  if (e.target.closest("[data-reset]")) { state.health = {}; state.notes = {}; go("canvas"); }
});
$("brand").addEventListener("click", () => go("canvas"));
$("menuBtn").addEventListener("click", () => document.body.classList.toggle("nav-open"));
$("overlay").addEventListener("click", () => document.body.classList.remove("nav-open"));

// Anotações são salvas sem re-renderizar, para não perder o foco do campo
document.addEventListener("input", e => {
  if (e.target.id === "notes") state.notes = { ...state.notes, [state.view]: e.target.value };
});

render();
</script>
</body>
</html>
