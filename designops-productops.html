<meta name="description" content="Modelo interativo para avaliar o nível de convergência entre DesignOps e Product Ops na sua organização, em 6 dimensões.">
<meta name="theme-color" content="#111118">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="creations.css">
<style>
  /* ---------- Específico do DesignOps × Product Ops ---------- */
  .dim-head h2 .icon { font-family: var(--sans); font-size: 22px; margin-right: 6px; }
  .lvl-badge { font-size: 12px; letter-spacing: .18em; text-transform: uppercase; padding: 4px 10px; border: 1px solid currentColor; }

  .opt { display: flex; gap: 14px; align-items: flex-start; text-align: left; padding: 18px 20px; border: 1px solid var(--line); background: var(--surface); color: var(--text-2); font-size: 16px; line-height: 1.5; transition: background .2s, border-color .2s, color .2s; }
  .opt:hover { border-color: var(--accent-line); }
  .opt.sel { color: var(--text); background: var(--accent-soft); }
  .opt .lvl { flex-shrink: 0; width: 28px; height: 28px; border: 1px solid var(--line-2); display: flex; align-items: center; justify-content: center; font-family: var(--serif); font-size: 18px; color: var(--muted); }

  .progress { display: flex; align-items: center; gap: 20px; flex-wrap: wrap; }
  .progress-label { font-size: 13px; letter-spacing: .2em; text-transform: uppercase; color: var(--muted); }
  .progress-track { flex: 1; min-width: 160px; height: 3px; background: var(--line-2); }
  .progress-fill { height: 100%; background: var(--accent); transition: width .3s; }

  .k-design { color: var(--bad); }
  .k-product { color: var(--accent-2); }
  .card.conv { border-top: 1px solid var(--accent); background: linear-gradient(180deg, var(--accent-soft), var(--surface) 70%); }
  .card.conv p { color: var(--text); }

  .score-card { display: grid; grid-template-columns: auto 1fr; gap: 32px; align-items: center; padding: 36px; }
  .score-num { font-family: var(--serif); font-size: 96px; line-height: .9; }
  .score-of { font-size: 13px; letter-spacing: .2em; text-transform: uppercase; color: var(--muted); margin-top: 16px; }
  .score-card h4 { font-size: 36px; }
  .res-row { display: grid; grid-template-columns: 32px 1fr 200px 28px; gap: 16px; align-items: center; padding: 14px 0; border-bottom: 1px solid var(--line); }
  .res-row:last-child { border-bottom: 0; }
  .res-row .icon { font-size: 18px; }
  .res-row .label { font-size: 16px; color: var(--text-2); }
  .track { height: 4px; background: var(--line-2); }
  .fill { height: 100%; transition: width .5s ease; }
  .res-n { font-family: var(--serif); font-size: 24px; text-align: right; }
  .empty { border-style: dashed; text-align: center; padding: 56px 24px; }
  .empty .kicker { margin-bottom: 12px; }
  .empty p { margin-bottom: 24px; }

  @media (max-width: 640px) {
    .score-card { grid-template-columns: 1fr; gap: 16px; padding: 28px 24px; }
    .score-num { font-size: 72px; }
    .res-row { grid-template-columns: 28px 1fr 28px; }
    .res-row .track { grid-column: 2 / 4; grid-row: 2; }
  }
</style>
</head>

// Escala de maturidade nas cores do portfólio: do rosa (fragmentado) ao lilás (fluido)

    { min: 2.5, max: 3.5, label: "Integrado", color: "#9B7FD4", desc: "Convergência ativa com práticas e governança compartilhadas" },

  ],
  en: [

};

// Idioma: ?lang= no endereço, depois a última escolha salva no portal, depois o idioma do navegador
function pickLang() {
  const q = new URLSearchParams(location.search).get("lang");
  if (q === "pt" || q === "en") return q;
  try { const s = localStorage.getItem("portal-lang"); if (s === "pt" || s === "en") return s; } catch (e) {}
  return (navigator.language || "pt").toLowerCase().startsWith("pt") ? "pt" : "en";
}

const VIEWS = ["assess", "model", "result"];
const state = { lang: pickLang(), view: "assess", answers: {} };
const $ = id => document.getElementById(id);
const maturity = score => MATURITY[state.lang].find(m => score >= m.min && score < m.max) || MATURITY[state.lang][0];

function sidebarView(t, dims) {
  const answered = Object.keys(state.answers).length;
  const item = (go, num, label, extra = "", anchor = "") =>
    `<button class="nav-item${state.view === go && !anchor ? " active" : ""}" data-go="${go}"${anchor ? ` data-anchor="${anchor}"` : ""}><span class="nav-num">${num}</span>${label}${extra}</button>`;
  return `
    <div class="nav-home"><a class="nav-item" href="./?lang=${state.lang}"><span class="nav-num">←</span>${t.homeNav}</a></div>
    <div class="nav-group">
      <div class="nav-label">${t.navOverview}</div>
      ${item("assess", "01", t.navAssess)}
      ${item("model", "02", t.navModel)}
      ${item("result", "03", t.navResult, `<span class="nav-status" style="color:var(--muted)">${answered}/${dims.length}</span>`)}
    </div>
    <div class="nav-group">
      <div class="nav-label">${t.navDims}</div>
      ${dims.map((d, i) => {
        const a = state.answers[d.id];
        return item("assess", String(i + 1).padStart(2, "0"), d.label,
          a ? `<span class="nav-status" style="color:${maturity(a).color}">${a}</span>` : "", d.id);
      }).join("")}
    </div>`;
}

function assessView(t, dims) {
  const answered = Object.keys(state.answers).length;
  const blocks = dims.map((d, i) => {
    const a = state.answers[d.id];
    const badge = a ? `<span class="lvl-badge" style="color:${maturity(a).color}">${t.level(a)}</span>` : "";
    const options = d.questions.map((q, qi) => {
      const level = qi + 1, sel = a === level, c = maturity(level).color;
      return `
        <button class="opt${sel ? " sel" : ""}" data-dim="${d.id}" data-level="${level}" aria-pressed="${sel}" style="${sel ? `border-color:${c}` : ""}">
          <span class="lvl" style="${sel ? `border-color:${c};background:${c};color:#111118` : ""}">${level}</span>
          <span>${q}</span>
        </button>`;
    }).join("");
    return `
      <div class="block" id="dim-${d.id}">
        <div class="block-head dim-head"><h2><span class="icon">${d.icon}</span>${String(i + 1).padStart(2, "0")} · ${d.label}</h2>${badge}</div>
        <div class="grid g2">${options}</div>
      </div>`;
  }).join("");
  return `
    <div class="eyebrow">${t.eyebrow}</div>
    <h1 class="title display">${t.title}</h1>
    <p class="lede">${t.lede} ${t.assessIntro}</p>
    ${blocks}
    <div class="block">
      <div class="progress">
        <span class="progress-label">${answered}/${dims.length} ${t.answered}</span>
        <div class="progress-track"><div class="progress-fill" style="width:${(answered / dims.length) * 100}%"></div></div>
        ${answered === dims.length ? `<button class="btn primary" data-go="result">${t.seeResult}</button>` : ""}
      </div>
    </div>
    <div class="pager"><button class="next" data-go="model"><small>${t.next}</small><span>${t.navModel}</span></button></div>`;
}

function modelView(t, dims) {
  const blocks = dims.map((d, i) => `
    <div class="block">
      <div class="block-head dim-head"><h2><span class="icon">${d.icon}</span>${String(i + 1).padStart(2, "0")} · ${d.label}</h2></div>
      <div class="grid g3">
        <div class="card"><div class="kicker k-design">${t.designOps}</div><p>${d.designOps}</p></div>
        <div class="card"><div class="kicker k-product">${t.productOps}</div><p>${d.productOps}</p></div>
        <div class="card conv"><div class="kicker">${t.convergence}</div><p>${d.convergence}</p></div>
      </div>
    </div>`).join("");
  return `
    <div class="eyebrow">${t.modelEyebrow}</div>
    <h1 class="title">${t.modelTitle}</h1>
    <p class="lede">${t.modelLede}</p>
    ${blocks}
    <div class="pager">
      <button class="prev" data-go="assess"><small>${t.prev}</small><span>${t.navAssess}</span></button>
      <button class="next" data-go="result"><small>${t.next}</small><span>${t.navResult}</span></button>
    </div>`;
}

function resultView(t, dims) {
  const answered = Object.keys(state.answers).length;
  const head = `
    <div class="eyebrow">${t.resultEyebrow}</div>
    <h1 class="title">${t.resultTitle}</h1>
    <p class="lede">${t.resultLede}</p>`;
  if (answered < dims.length) {
    return head + `
      <div class="card empty">
        <div class="kicker">${t.insufficient}</div>
        <p>${t.insufficientDesc(dims.length - answered)}</p>
        <button class="btn" data-go="assess">${t.goAssess}</button>
      </div>`;
  }
  const avg = dims.reduce((s, d) => s + state.answers[d.id], 0) / dims.length;
  const m = maturity(avg);
  const weak = dims.filter(d => state.answers[d.id] <= 2);
  const rows = dims.map(d => {
    const s = state.answers[d.id], c = maturity(s).color;
    return `
      <div class="res-row">
        <span class="icon">${d.icon}</span>
        <span class="label">${d.label}</span>
        <div class="track"><div class="fill" style="width:${(s / 4) * 100}%;background:${c}"></div></div>
        <span class="res-n" style="color:${c}">${s}</span>
      </div>`;
  }).join("");
  return head + `
    <div class="block">
      <div class="card score-card" style="border-top:1px solid ${m.color}">
        <div>
          <div class="score-num" style="color:${m.color}">${avg.toFixed(1)}</div>
          <div class="score-of">${t.of}</div>
        </div>
        <div><h4>${m.label}</h4><p>${m.desc}</p></div>
      </div>
    </div>
    <div class="block">
      <div class="block-head"><h2>${t.byDim}</h2></div>
      <div class="card">${rows}</div>
    </div>
    <div class="block">
      <div class="block-head"><h2>${t.nextSteps}</h2></div>
      ${weak.length
        ? `<div class="grid g3">${weak.slice(0, 3).map(d => `
            <div class="card side"><div class="kicker">${d.icon} ${d.label}</div><p>${d.convergence}</p></div>`).join("")}</div>`
        : `<p class="quote">${t.goodShape}</p>`}
    </div>
    <div class="actions"><button class="btn ghost" data-reset>${t.reset}</button></div>`;
}

let lastView = null;
function render() {
  const t = UI[state.lang];
  const dims = DIMENSIONS[state.lang];
  document.documentElement.lang = state.lang === "pt" ? "pt-BR" : "en";
  document.title = t.docTitle;
  $("brand").innerHTML = t.brand;
  $("homeLink").textContent = t.home;
  $("homeLink").href = "./?lang=" + state.lang;
  $("footNote").innerHTML = t.foot;
  $("menuBtn").setAttribute("aria-label", t.menu);
  $("sidebar").setAttribute("aria-label", t.nav);
  document.querySelectorAll(".lang button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === state.lang)));
  $("sidebar").innerHTML = sidebarView(t, dims);
  const body = state.view === "model" ? modelView(t, dims) : state.view === "result" ? resultView(t, dims) : assessView(t, dims);
  // A animação de entrada só roda ao trocar de seção, não a cada resposta
  const animate = state.view !== lastView;
  lastView = state.view;
  $("content").innerHTML = `<div class="${animate ? "view" : ""}">${body}</div>`;
}

function go(view, anchor) {
  const sameView = view === state.view;
  state.view = VIEWS.includes(view) ? view : "assess";
  document.body.classList.remove("nav-open");
  if (!sameView) render();
  const target = anchor && document.getElementById("dim-" + anchor);
  if (target) window.scrollTo({ top: target.getBoundingClientRect().top + window.scrollY - 100, behavior: "smooth" });
  else window.scrollTo({ top: 0, behavior: "auto" });
}

function setLang(next) {
  if (next === state.lang) return;
  state.lang = next;
  try { localStorage.setItem("portal-lang", next); } catch (e) {}
  const url = new URL(location.href);
  url.searchParams.set("lang", next);
  history.replaceState(null, "", url);
  render();
}

document.addEventListener("click", e => {
  const l = e.target.closest(".lang button");
  if (l) { setLang(l.dataset.lang); return; }
  const g = e.target.closest("[data-go]");
  if (g) { go(g.dataset.go, g.dataset.anchor); return; }
  const o = e.target.closest("[data-dim]");
  if (o) {
    state.answers = { ...state.answers, [o.dataset.dim]: Number(o.dataset.level) };
    const y = window.scrollY;
    render();
    window.scrollTo(0, y);
    return;
  }
  if (e.target.closest("[data-reset]")) { state.answers = {}; render(); go("assess"); }
});
$("brand").addEventListener("click", () => go("assess"));
$("menuBtn").addEventListener("click", () => document.body.classList.toggle("nav-open"));
$("overlay").addEventListener("click", () => document.body.classList.remove("nav-open"));

render();
</script>
</body>
</html>
