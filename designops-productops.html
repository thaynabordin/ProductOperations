<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DesignOps × Product Ops — Modelo de Convergência</title>
  <meta name="description" content="Modelo interativo para avaliar o nível de convergência entre DesignOps e Product Ops na sua organização, em 6 dimensões.">
  <meta name="theme-color" content="#111118">
  <style>
    /* Paleta do portfólio (thaynabordin.github.io) */
    :root{
      --paper:#111118;--deep:#16161f;--surface:#1e1e2e;--ink:#F0F0F0;--text-2:#A8A8C0;--muted:#6B6B85;--faint:#4A4A60;
      --accent:#9B7FD4;--accent-soft:#D4C4F0;--rose:#E07A9A;
      --border:rgba(155,127,212,.15);--border-strong:rgba(155,127,212,.3);
    }
    *,*::before,*::after{box-sizing:border-box;}
    html,body{margin:0;background:var(--paper);}
    body{color:var(--ink);font-family:'Segoe UI','Helvetica Neue',Arial,sans-serif;min-height:100vh;overflow-x:hidden;}
    button{font-family:inherit;}

    header.head{background:linear-gradient(135deg,var(--paper) 0%,var(--deep) 40%,var(--surface) 100%);border-bottom:1px solid var(--border-strong);padding:20px 24px 28px;position:relative;overflow:hidden;}
    .glow1{position:absolute;top:-60px;right:-60px;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,rgba(155,127,212,.18) 0%,transparent 70%);}
    .glow2{position:absolute;bottom:-40px;left:-40px;width:150px;height:150px;border-radius:50%;background:radial-gradient(circle,rgba(224,122,154,.08) 0%,transparent 70%);}
    .wrap{position:relative;z-index:1;max-width:640px;margin:0 auto;}
    .home-link{display:inline-block;margin-bottom:20px;font-size:12px;font-weight:600;letter-spacing:.04em;color:var(--text-2);text-decoration:none;}
    .home-link:hover{color:var(--accent-soft);}
    .pill{display:inline-block;background:rgba(155,127,212,.15);border:1px solid rgba(155,127,212,.4);border-radius:20px;padding:4px 14px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent-soft);margin-bottom:14px;font-weight:600;}
    h1{font-size:26px;font-weight:800;line-height:1.15;margin:0 0 8px;background:linear-gradient(135deg,var(--ink) 30%,var(--accent-soft) 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:var(--ink);}
    .head-sub{font-size:15px;font-weight:400;color:var(--text-2);margin:0;line-height:1.5;}

    .tabs{display:flex;max-width:640px;margin:0 auto;border-bottom:1px solid var(--border);}
    .tabs button{flex:1;padding:14px 16px;background:none;border:none;border-bottom:2px solid transparent;color:var(--muted);font-size:13px;font-weight:600;cursor:pointer;letter-spacing:.03em;transition:all .2s;}
    .tabs button.on{border-bottom-color:var(--accent);color:var(--ink);}

    main{max-width:640px;margin:0 auto;padding:20px 16px 40px;}
    .intro{font-size:13px;color:var(--text-2);line-height:1.7;margin:0 0 24px;}

    /* Modelo */
    .dim{background:rgba(155,127,212,.03);border:1px solid var(--border);border-radius:12px;padding:16px 18px;margin-bottom:10px;cursor:pointer;transition:all .25s ease;width:100%;text-align:left;color:inherit;display:block;}
    .dim.open{background:linear-gradient(135deg,rgba(155,127,212,.12) 0%,rgba(30,30,46,.6) 100%);border-color:rgba(155,127,212,.4);}
    .dim-head{display:flex;align-items:center;gap:12px;}
    .dim-icon{font-size:22px;}
    .dim-label{font-size:14px;font-weight:700;flex:1;}
    .chev{font-size:18px;color:var(--muted);transition:transform .2s;}
    .dim.open .chev{transform:rotate(180deg);}
    .dim-body{margin-top:16px;}
    .pair{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;}
    .box{border-radius:8px;padding:12px;}
    .box-t{font-size:10px;text-transform:uppercase;letter-spacing:.1em;font-weight:700;margin-bottom:6px;}
    .box-d{font-size:12px;color:var(--text-2);line-height:1.5;}
    .box.design{background:rgba(224,122,154,.08);border:1px solid rgba(224,122,154,.22);}
    .box.design .box-t{color:var(--rose);}
    .box.product{background:rgba(212,196,240,.06);border:1px solid rgba(212,196,240,.2);}
    .box.product .box-t{color:var(--accent-soft);}
    .box.conv{background:rgba(155,127,212,.1);border:1px solid rgba(155,127,212,.28);}
    .box.conv .box-t{color:var(--accent);}
    .box.conv .box-d{color:var(--ink);line-height:1.6;}

    /* Diagnóstico */
    .q-block{margin-bottom:24px;}
    .q-head{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
    .q-head .ic{font-size:18px;}
    .q-title{font-size:13px;font-weight:700;color:var(--ink);}
    .lvl-badge{margin-left:auto;font-size:10px;padding:2px 8px;border-radius:10px;font-weight:700;white-space:nowrap;}
    .opts{display:flex;flex-direction:column;gap:6px;}
    .opt{background:rgba(155,127,212,.02);border:1px solid var(--border);border-radius:8px;padding:10px 14px;color:var(--text-2);font-size:12px;line-height:1.5;cursor:pointer;text-align:left;transition:all .2s;display:flex;align-items:flex-start;gap:10px;}
    .opt:hover{border-color:var(--border-strong);}
    .opt.sel{color:var(--ink);}
    .dot{width:20px;height:20px;min-width:20px;border-radius:50%;border:2px solid rgba(155,127,212,.25);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;color:transparent;transition:all .2s;margin-top:1px;}
    .opt.sel .dot{color:var(--paper);}
    .cta{width:100%;padding:16px;background:var(--accent);border:none;border-radius:12px;color:var(--paper);font-size:15px;font-weight:700;cursor:pointer;margin-top:8px;letter-spacing:.02em;box-shadow:0 4px 20px rgba(155,127,212,.25);transition:background .2s;}
    .cta:hover{background:var(--accent-soft);}
    .progress{font-size:11px;color:var(--muted);text-align:center;letter-spacing:.06em;margin-top:4px;}

    /* Resultado */
    .hero-score{background:linear-gradient(135deg,rgba(155,127,212,.15) 0%,rgba(30,30,46,.5) 100%);border:1px solid var(--border-strong);border-radius:16px;padding:28px 24px;text-align:center;margin-bottom:24px;}
    .score-dot{width:22px;height:22px;border-radius:50%;margin:0 auto 12px;}
    .score{font-size:44px;font-weight:900;line-height:1;margin-bottom:4px;}
    .score-of{font-size:10px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;margin-bottom:8px;}
    .score-label{font-size:18px;font-weight:800;color:var(--ink);margin-bottom:6px;}
    .score-desc{font-size:13px;color:var(--text-2);line-height:1.5;}
    h3{font-size:13px;font-weight:700;color:var(--ink);margin:0 0 14px;letter-spacing:.03em;}
    .res-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid rgba(155,127,212,.08);}
    .res-row .ic{font-size:16px;}
    .res-label{font-size:12px;flex:1;color:var(--text-2);}
    .track{width:100px;height:6px;background:rgba(155,127,212,.1);border-radius:3px;overflow:hidden;}
    .fill{height:100%;border-radius:3px;transition:width .5s ease;}
    .res-n{font-size:13px;font-weight:800;min-width:18px;text-align:right;}
    .next{background:rgba(155,127,212,.03);border:1px solid var(--border);border-radius:12px;padding:18px;margin:24px 0 20px;}
    .next h3{margin-bottom:12px;}
    .step{padding:10px 12px;background:rgba(155,127,212,.08);border:1px solid var(--border);border-radius:8px;margin-bottom:8px;font-size:12px;line-height:1.6;color:var(--text-2);}
    .step strong{color:var(--accent-soft);}
    .good{font-size:12px;color:var(--text-2);line-height:1.6;}
    .reset{width:100%;padding:14px;background:rgba(155,127,212,.05);border:1px solid var(--border-strong);border-radius:10px;color:var(--text-2);font-size:13px;font-weight:600;cursor:pointer;}
    .reset:hover{color:var(--ink);}

    footer{text-align:center;padding:16px;border-top:1px solid rgba(155,127,212,.08);font-size:11px;color:var(--faint);}
    footer a{color:var(--muted);text-decoration:none;}
    footer a:hover{color:var(--accent-soft);}

    @media(max-width:420px){.pair{grid-template-columns:1fr;}}
    @media(prefers-reduced-motion:reduce){*{transition:none!important;}}
  </style>
</head>
<body>
<header class="head">
  <div class="glow1"></div><div class="glow2"></div>
  <div class="wrap">
    <a class="home-link" href="./">← Portal de criações</a><br>
    <div class="pill">Modelo Interativo</div>
    <h1>DesignOps × Product Ops</h1>
    <p class="head-sub">Avalie o nível de convergência entre as duas disciplinas na sua organização</p>
  </div>
</header>

<nav class="tabs" id="tabs">
  <button data-tab="assess" class="on">Diagnóstico</button>
  <button data-tab="framework">Modelo</button>
</nav>

<main id="main"></main>

<footer><a href="./">DesignOps × Product Ops — Modelo de Convergência — por Thayná Bordin</a></footer>

<script>
const DIMENSIONS = [
  { id: "rituals", label: "Rituais & Cerimônias", icon: "🔄",
    designOps: "Críticas de design, Alinhamentos de sistema de design, Revisões de entrega",
    productOps: "Revisões de ciclo, Acompanhamento de objetivos, Alinhamentos de portfólio",
    convergence: "Cerimônias integradas onde decisões de design e produto acontecem juntas, eliminando entregas fragmentadas",
    questions: [
      { text: "Rituais de design e produto são separados e desconectados", level: 1 },
      { text: "Existe alguma sobreposição, mas cada área mantém seus próprios rituais", level: 2 },
      { text: "Rituais compartilhados existem, com cadência definida e participação cruzada", level: 3 },
      { text: "Cerimônias são integradas intencionalmente, com governança unificada e ciclos de retorno claros", level: 4 },
    ] },
  { id: "tooling", label: "Ferramentas & Infraestrutura", icon: "🛠️",
    designOps: "Editores visuais, Tokens de design, Bibliotecas de componentes, Documentação de design",
    productOps: "Gestão de backlog, Visão de portfólio, Priorização, Análise de dados",
    convergence: "Ecossistema integrado onde métricas de design (adoção, consistência) alimentam decisões de produto e vice-versa",
    questions: [
      { text: "Ferramentas completamente isoladas, sem integração entre design e produto", level: 1 },
      { text: "Algumas integrações pontuais existem, mas não são sistêmicas", level: 2 },
      { text: "Ferramentas conectadas com fluxos automatizados e painéis compartilhados", level: 3 },
      { text: "Ecossistema unificado com fonte única de verdade para decisões entre disciplinas", level: 4 },
    ] },
  { id: "metrics", label: "Métricas & Resultados", icon: "📊",
    designOps: "Adoção do sistema de design, Índice de consistência, Débito de experiência",
    productOps: "Progresso de objetivos, Adoção de funcionalidades, Tempo até o mercado",
    convergence: "Modelo de métricas compartilhado onde indicadores de experiência e produto se complementam para medir valor real",
    questions: [
      { text: "Cada área tem métricas próprias que não conversam entre si", level: 1 },
      { text: "Algumas métricas são compartilhadas, mas sem modelo estruturado", level: 2 },
      { text: "Modelo de métricas integrado com indicadores antecedentes e consequentes conectados", level: 3 },
      { text: "Métricas de experiência e produto formam um sistema coeso orientado a resultados de negócio", level: 4 },
    ] },
  { id: "governance", label: "Governança & Decisão", icon: "⚖️",
    designOps: "Revisões de design, Governança de marca, Responsabilidade sobre componentes",
    productOps: "Priorização de roteiro, Planejamento de capacidade, Caminhos de escalação",
    convergence: "Modelo de governança unificado onde as trocas entre qualidade de experiência e velocidade são explícitas e bem gerenciadas",
    questions: [
      { text: "Decisões de design e produto acontecem isoladas, gerando conflitos frequentes", level: 1 },
      { text: "Existe comunicação entre as áreas, mas sem modelo formal de co-decisão", level: 2 },
      { text: "Governança compartilhada com papéis claros e critérios de decisão definidos", level: 3 },
      { text: "Modelo de decisão integrado com trocas explícitas e responsabilidade compartilhada", level: 4 },
    ] },
  { id: "enablement", label: "Capacitação & Conhecimento", icon: "🧠",
    designOps: "Integração de designers, Diretrizes, Guias práticos de design",
    productOps: "Integração de gestores de produto, Modelos, Guias práticos de produto",
    convergence: "Base de conhecimento unificada que capacita tanto gestores de produto quanto designers a operar de forma autônoma e alinhada",
    questions: [
      { text: "Cada área tem seus próprios materiais sem padronização ou compartilhamento", level: 1 },
      { text: "Materiais parcialmente compartilhados, mas sem estratégia de capacitação integrada", level: 2 },
      { text: "Guias e diretrizes unificados com programa de capacitação entre áreas", level: 3 },
      { text: "Organização que aprende, onde conhecimento flui naturalmente entre design e produto", level: 4 },
    ] },
  { id: "community", label: "Comunidade & Cultura", icon: "🌱",
    designOps: "Comunidade de prática de design, Mentoria, Palestras de design",
    productOps: "Comunidade de gestores de produto, Guildas, Sessões de troca",
    convergence: "Comunidade integrada onde designers e gestores de produto co-criam práticas e compartilham aprendizados continuamente",
    questions: [
      { text: "Comunidades isoladas sem interação entre design e produto", level: 1 },
      { text: "Interações pontuais existem, mas não há comunidade entre áreas estruturada", level: 2 },
      { text: "Comunidade de prática conjunta com eventos regulares e responsabilidade compartilhada", level: 3 },
      { text: "Cultura de colaboração orgânica onde as fronteiras entre operações de design e produto são fluidas", level: 4 },
    ] },
];

// Escala de maturidade nas cores do portfólio: do rosa (fragmentado) ao lilás (fluido)
const MATURITY_LABELS = [
  { min: 1, max: 1.5, label: "Fragmentado", color: "#E07A9A", desc: "Operações de design e produto funcionam como mundos paralelos" },
  { min: 1.5, max: 2.5, label: "Emergente", color: "#C48FC9", desc: "Pontes começam a surgir entre as disciplinas" },
  { min: 2.5, max: 3.5, label: "Integrado", color: "#9B7FD4", desc: "Convergência ativa com práticas e governança compartilhadas" },
  { min: 3.5, max: 4.1, label: "Fluido", color: "#D4C4F0", desc: "As fronteiras entre as operações são intencionalmente permeáveis" },
];
const getMaturityInfo = score => MATURITY_LABELS.find(m => score >= m.min && score < m.max) || MATURITY_LABELS[0];

const state = { answers: {}, tab: "assess", expanded: null, showResults: false };
const main = document.getElementById("main");
const tabs = document.getElementById("tabs");

function frameworkView() {
  return `
    <p class="intro">A convergência entre operações de design e operações de produto acontece em 6 dimensões. Toque em cada uma para explorar como as disciplinas se complementam.</p>
    ${DIMENSIONS.map(d => {
      const open = state.expanded === d.id;
      return `
        <button class="dim ${open ? "open" : ""}" data-expand="${d.id}" aria-expanded="${open}">
          <div class="dim-head"><span class="dim-icon">${d.icon}</span><span class="dim-label">${d.label}</span><span class="chev">▾</span></div>
          ${open ? `
            <div class="dim-body">
              <div class="pair">
                <div class="box design"><div class="box-t">Operações de Design</div><div class="box-d">${d.designOps}</div></div>
                <div class="box product"><div class="box-t">Operações de Produto</div><div class="box-d">${d.productOps}</div></div>
              </div>
              <div class="box conv"><div class="box-t">✦ Convergência</div><div class="box-d">${d.convergence}</div></div>
            </div>` : ""}
        </button>`;
    }).join("")}`;
}

function assessView() {
  const answered = Object.keys(state.answers).length;
  return `
    <p class="intro">Selecione a afirmação que melhor descreve a realidade da sua organização em cada dimensão.</p>
    ${DIMENSIONS.map((d, i) => {
      const a = state.answers[d.id];
      const badge = a ? (() => { const c = getMaturityInfo(a).color; return `<span class="lvl-badge" style="background:${c}22;color:${c}">Nível ${a}</span>`; })() : "";
      return `
        <div class="q-block">
          <div class="q-head"><span class="ic">${d.icon}</span><span class="q-title">${i + 1}. ${d.label}</span>${badge}</div>
          <div class="opts">
            ${d.questions.map(q => {
              const sel = a === q.level;
              const c = getMaturityInfo(q.level).color;
              return `
                <button class="opt ${sel ? "sel" : ""}" data-dim="${d.id}" data-level="${q.level}" style="${sel ? `background:${c}18;border-color:${c}66` : ""}">
                  <span class="dot" style="${sel ? `border-color:${c};background:${c}` : ""}">${q.level}</span>
                  <span>${q.text}</span>
                </button>`;
            }).join("")}
          </div>
        </div>`;
    }).join("")}
    ${answered === DIMENSIONS.length
      ? `<button class="cta" data-results>Ver meu diagnóstico →</button>`
      : `<div class="progress">${answered}/${DIMENSIONS.length} dimensões respondidas</div>`}`;
}

function resultsView() {
  const avg = DIMENSIONS.reduce((s, d) => s + state.answers[d.id], 0) / DIMENSIONS.length;
  const m = getMaturityInfo(avg);
  const weak = DIMENSIONS.filter(d => state.answers[d.id] <= 2);
  return `
    <div class="hero-score">
      <div class="score-dot" style="background:${m.color};box-shadow:0 0 18px ${m.color}66"></div>
      <div class="score" style="color:${m.color}">${avg.toFixed(1)}</div>
      <div class="score-of">de 4.0</div>
      <div class="score-label">${m.label}</div>
      <div class="score-desc">${m.desc}</div>
    </div>
    <h3>Resultado por dimensão</h3>
    ${DIMENSIONS.map(d => {
      const s = state.answers[d.id];
      const c = getMaturityInfo(s).color;
      return `
        <div class="res-row">
          <span class="ic">${d.icon}</span><span class="res-label">${d.label}</span>
          <div class="track"><div class="fill" style="width:${(s / 4) * 100}%;background:${c}"></div></div>
          <span class="res-n" style="color:${c}">${s}</span>
        </div>`;
    }).join("")}
    <div class="next">
      <h3>Próximos passos sugeridos</h3>
      ${weak.length
        ? weak.slice(0, 3).map(d => `<div class="step"><strong>${d.icon} ${d.label}:</strong> ${d.convergence}</div>`).join("")
        : `<div class="good">Sua organização já demonstra boa convergência! Foque em escalar as práticas que funcionam e documentar o que aprendeu para a comunidade.</div>`}
    </div>
    <button class="reset" data-reset>Refazer diagnóstico</button>`;
}

function render() {
  tabs.querySelectorAll("button").forEach(b => b.classList.toggle("on", b.dataset.tab === state.tab));
  if (state.tab === "framework") main.innerHTML = frameworkView();
  else main.innerHTML = state.showResults ? resultsView() : assessView();
}

tabs.addEventListener("click", e => {
  const b = e.target.closest("button[data-tab]");
  if (b) { state.tab = b.dataset.tab; render(); }
});

main.addEventListener("click", e => {
  const b = e.target.closest("button");
  if (!b) return;
  if (b.dataset.expand) state.expanded = state.expanded === b.dataset.expand ? null : b.dataset.expand;
  else if (b.dataset.dim) state.answers = { ...state.answers, [b.dataset.dim]: Number(b.dataset.level) };
  else if ("results" in b.dataset) { state.showResults = true; scrollTo(0, 0); }
  else if ("reset" in b.dataset) { state.answers = {}; state.showResults = false; state.expanded = null; scrollTo(0, 0); }
  else return;
  render();
});

render();
</script>
</body>
</html>
